<style>
  :root{
    --bg:#F6F7F9;
    --surface:#FFFFFF;
    --surface-2:#EFF2F5;
    --border:#DFE3E9;
    --text:#1A2130;
    --text-muted:#5C6675;
    --text-faint:#8791A0;
    --accent:#0E6E76;
    --accent-ink:#FFFFFF;
    --accent-wash:#E3F1F1;
    --accent-strong:#0A565C;
    --success:#1E8E5A;
    --success-wash:#E4F5EC;
    --warning:#B4780F;
    --warning-wash:#FBF1DE;
    --danger:#C03A34;
    --danger-wash:#FBE9E8;
    --neutral-pill:#5C6675;
    --neutral-wash:#EEF0F3;
    --shadow: 0 1px 2px rgba(20,30,45,.04), 0 6px 20px rgba(20,30,45,.06);
    --radius: 10px;
    --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1319;
      --surface:#171C24;
      --surface-2:#1D232C;
      --border:#2A3140;
      --text:#E7EBF1;
      --text-muted:#9AA5B4;
      --text-faint:#6E7889;
      --accent:#3FB6BE;
      --accent-ink:#06282A;
      --accent-wash:#123539;
      --accent-strong:#63CBD1;
      --success:#4CBE85;
      --success-wash:#122A20;
      --warning:#E0A64C;
      --warning-wash:#2E230F;
      --danger:#E2726C;
      --danger-wash:#331716;
      --neutral-pill:#9AA5B4;
      --neutral-wash:#242A34;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1319;
    --surface:#171C24;
    --surface-2:#1D232C;
    --border:#2A3140;
    --text:#E7EBF1;
    --text-muted:#9AA5B4;
    --text-faint:#6E7889;
    --accent:#3FB6BE;
    --accent-ink:#06282A;
    --accent-wash:#123539;
    --accent-strong:#63CBD1;
    --success:#4CBE85;
    --success-wash:#122A20;
    --warning:#E0A64C;
    --warning-wash:#2E230F;
    --danger:#E2726C;
    --danger-wash:#331716;
    --neutral-pill:#9AA5B4;
    --neutral-wash:#242A34;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-wash); }
  a{ color:var(--accent-strong); }
  h1,h2,h3,h4{ font-weight:600; margin:0 0 4px; text-wrap:balance; letter-spacing:-.01em; }
  table{ font-variant-numeric: tabular-nums; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- App shell ---------- */
  #app{ display:flex; min-height:100vh; }
  .sidebar{
    width:228px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center; color:var(--accent-ink); font-weight:700; font-size:15px; flex:none;
  }
  .brand-text .t1{ font-weight:700; font-size:14.5px; line-height:1.15; }
  .brand-text .t2{ font-size:11px; color:var(--text-faint); letter-spacing:.03em; text-transform:uppercase; }

  .nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:14px 10px 6px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:var(--text-muted);
    text-decoration:none; font-size:13.5px; font-weight:500; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:var(--accent-wash); color:var(--accent-strong); }
  .nav-item svg{ width:17px; height:17px; flex:none; }
  .sidebar-foot{ margin-top:auto; padding:10px; font-size:11px; color:var(--text-faint); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; background:var(--success); }
  .sync-dot.off{ background:var(--text-faint); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:19px; }
  .topbar .sub{ color:var(--text-muted); font-size:12.5px; margin-top:2px; }
  .content{ padding:24px 28px 60px; max-width:1320px; width:100%; margin:0 auto; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); font-weight:600; font-size:13px; transition:background .12s, border-color .12s;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ border-color:transparent; background:none; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn-xs{ padding:3px 7px; font-size:11px; border-radius:6px; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }
  .btn svg{ width:14px; height:14px; }
  .btn-danger{ background:var(--danger-wash); border-color:var(--danger-wash); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger); border-color:var(--danger); color:#fff; }

  /* ---------- Data & Backup page ---------- */
  .section-num{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:7px; background:var(--surface-2); color:var(--text-muted); font-size:11px; font-weight:700; font-family:var(--font-mono); flex:none; }
  .data-section{ margin-bottom:16px; }
  .data-section-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .data-section-head h2{ font-size:16px; margin:0; }
  .data-section-head .hint{ font-size:12px; color:var(--text-faint); text-align:right; max-width:380px; }
  .radio-row{ display:flex; align-items:flex-start; gap:9px; padding:9px 2px; cursor:pointer; }
  .radio-row input{ margin-top:3px; flex:none; }
  .radio-row .t{ font-size:13px; font-weight:600; }
  .radio-row .d{ font-size:12px; color:var(--text-faint); margin-top:1px; }
  .dropzone{
    border:1.5px dashed var(--border); border-radius:10px; padding:26px 16px; text-align:center;
    color:var(--text-faint); font-size:13px; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .dropzone:hover, .dropzone.dragover{ border-color:var(--accent); background:var(--accent-wash); }
  .stat-line{ display:flex; justify-content:space-between; padding:5px 0; font-size:13px; border-bottom:1px solid var(--border); }
  .stat-line:last-child{ border-bottom:none; }
  .stat-line .k{ color:var(--text-faint); }
  .stat-line .v{ font-family:var(--font-mono); font-weight:600; }

  /* ---------- Cards / layout ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:18px 20px; }
  .grid{ display:grid; gap:16px; }
  .kpi-grid{ grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); margin-bottom:18px; }
  .kpi{ padding:16px 18px; }
  .kpi .label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .kpi .value{ font-family:var(--font-mono); font-size:21px; font-weight:600; letter-spacing:-.01em; }
  .kpi .value small{ font-size:12px; color:var(--text-muted); font-weight:500; margin-left:4px;}
  .kpi .delta{ font-size:12px; margin-top:6px; color:var(--text-muted); }
  .two-col{ grid-template-columns: 1.4fr 1fr; align-items:stretch; }
  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 10px; }
  .section-title h2{ font-size:15px; }
  .section-title .hint{ font-size:12px; color:var(--text-faint); }

  /* ---------- Pills / badges ---------- */
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill-success{ background:var(--success-wash); color:var(--success); }
  .pill-warning{ background:var(--warning-wash); color:var(--warning); }
  .pill-danger{ background:var(--danger-wash); color:var(--danger); }
  .pill-neutral{ background:var(--neutral-wash); color:var(--neutral-pill); }
  .tag{ display:inline-block; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-muted); font-size:11.5px; }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); }
  table.data{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; table-layout:auto; }
  table.data.compact{ font-size:12px; }
  table.data.compact th, table.data.compact td{ padding:6px 6px; }
  table.data.compact .pill{ padding:2px 7px; font-size:11px; }
  .pagination{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:9px 14px; border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius);
    background:var(--surface); font-size:12.5px; margin-top:-1px;
  }
  .doc-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .doc-row:last-child{ border-bottom:none; }
  .progress-track{ width:100%; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:5px; background:var(--accent); transition:width .3s ease; }
  .status-chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .status-chip{ display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:var(--surface-2); font-size:12px; }
  .status-chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .select-sm{ font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); }

  /* ---------- Site detail / Statement visual polish ---------- */
  .avatar-badge{
    display:inline-flex; align-items:center; justify-content:center; flex:none; width:40px; height:40px; border-radius:11px;
    background:var(--accent-wash); color:var(--accent-strong); font-weight:700; font-size:15px; font-family:var(--font-ui);
  }
  .entity-head{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .entity-head .name{ font-size:15px; font-weight:700; line-height:1.25; }
  .entity-head .sub{ font-size:12.5px; color:var(--text-faint); margin-top:1px; }
  .info-group + .info-group{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .info-group-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .info-group-label svg{ width:12px; height:12px; opacity:.8; }
  .kv dd .field-ic{ display:inline-flex; align-items:center; gap:6px; }
  .kv dd .field-ic svg{ width:13px; height:13px; color:var(--text-faint); flex:none; }
  .balance-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .balance-tile{ border-radius:10px; padding:12px 14px; }
  .balance-tile .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; opacity:.75; margin-bottom:5px; }
  .balance-tile .value{ font-family:var(--font-mono); font-size:17px; font-weight:700; }
  .balance-tile.t-accent{ background:var(--accent-wash); color:var(--accent-strong); }
  .balance-tile.t-success{ background:var(--success-wash); color:var(--success); }
  .balance-tile.t-warning{ background:var(--warning-wash); color:var(--warning); }
  .balance-tile.t-neutral{ background:var(--neutral-wash); color:var(--text); }
  .total-due-box{
    border-radius:10px; padding:14px 16px; background:var(--accent-wash); border:1px solid var(--accent-wash);
    display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .total-due-box .amount{ font-family:var(--font-mono); font-size:19px; font-weight:700; color:var(--accent-strong); }
  .total-due-box .label{ font-size:12.5px; font-weight:700; color:var(--accent-strong); }
  .statement-customer-box{ background:var(--surface-2); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  table.data tbody tr.zebra:nth-child(even){ background:var(--surface-2); }
  table.data th{
    position:sticky; top:0; background:var(--surface-2); text-align:left; padding:9px 12px; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); border-bottom:1px solid var(--border); white-space:nowrap;
  }
  table.data td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.data tbody tr:last-child td{ border-bottom:none; }
  table.data tbody tr:hover{ background:var(--surface-2); }
  table.data td.num, table.data th.num{ text-align:right; font-family:var(--font-mono); }
  table.data tfoot td{ padding:10px 12px; font-weight:600; background:var(--surface-2); border-top:1px solid var(--border); font-family:var(--font-mono); }
  .row-link{ cursor:pointer; }
  .empty-state{ padding:44px 20px; text-align:center; color:var(--text-faint); }
  .empty-state svg{ width:32px; height:32px; margin-bottom:10px; opacity:.5; }
  .empty-state-sm{ padding:16px; text-align:center; color:var(--text-faint); font-size:13px; background:var(--surface-2); border-radius:var(--radius); }

  /* ---------- Forms / filters ---------- */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field select, .field textarea{
    padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); width:100%;
  }
  .field select[multiple]{ height:132px; }
  .field textarea{ resize:vertical; min-height:56px; }
  .filter-bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; }
  .filter-bar .field{ min-width:150px; }
  .filter-bar .field.grow{ flex:1; min-width:200px; }
  .form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .form-grid .span2{ grid-column:1/-1; }

  /* ---------- Modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,19,25,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:14px; border:1px solid var(--border); width:100%; max-width:520px; box-shadow:var(--shadow); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:15px; }
  .modal-body{ padding:20px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--border); }
  .icon-btn{ background:none; border:none; color:var(--text-faint); padding:4px; border-radius:6px; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }

  /* ---------- Toast ---------- */
  #toasts{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .toast{ background:var(--text); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); animation:toastIn .15s ease-out; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- Misc ---------- */
  .muted{ color:var(--text-muted); }
  .faint{ color:var(--text-faint); }
  .stack{ display:flex; flex-direction:column; gap:4px; }
  .row{ display:flex; align-items:center; gap:8px; }
  .row.between{ justify-content:space-between; }
  .row.wrap{ flex-wrap:wrap; }
  .divider{ height:1px; background:var(--border); margin:16px 0; }
  .search-note{ font-size:11.5px; color:var(--text-faint); margin-top:4px; }
  .banner{ padding:10px 14px; border-radius:8px; background:var(--warning-wash); color:var(--warning); font-size:12.5px; margin-bottom:16px; display:flex; gap:8px; align-items:center; }
  .link-btn{ background:none; border:none; color:var(--accent-strong); font-weight:600; padding:0; text-decoration:underline; text-underline-offset:2px; }
  .kv{ display:grid; grid-template-columns: 130px 1fr; gap:6px 10px; font-size:13px; }
  .kv dt{ color:var(--text-faint); }
  .kv dd{ margin:0; }
  .chart-box{ position:relative; height:230px; }
  .avatar-chip{ width:30px; height:30px; border-radius:8px; background:var(--accent-wash); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none; }

  .statement-logo{ height:46px; width:auto; display:block; margin-bottom:8px; }
  .stage-input{ width:100%; padding:5px 6px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font-family:var(--font-mono); font-size:12.5px; }
  .stage-input.text{ font-family:var(--font-ui); }
  textarea.stage-input{ font-family:var(--font-ui); min-height:52px; resize:vertical; }
  .edit-banner{ display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; background:var(--warning-wash); color:var(--warning); font-size:12px; margin-bottom:12px; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#000; }
    .print-sheet{ box-shadow:none !important; border:none !important; }
  }
  @media (max-width: 880px){
    .sidebar{ display:none; }
    .content{ padding:18px 14px 60px; }
    .two-col{ grid-template-columns:1fr; }
  }

  /* =====================================================================
     Lumen theme, matching AMC Receivables. Appearance and motion only.
     Dark mode is graphite glass with paper-white pills; light mode is warm
     paper glass with graphite pills.
     ===================================================================== */
  :root{
    color-scheme: light;
    --bg0:#F1EEE8; --bg1:#CFC9BF; --glow:#FFFFFF; --glow-2:#DDD8CF;
    --edge:rgba(30,30,30,.11); --edge-hi:rgba(30,30,30,.32);
    --glass:linear-gradient(160deg, rgba(255,255,255,.78), rgba(255,255,255,.44));
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.9); --pane-shadow:0 24px 48px -30px rgba(60,50,35,.45);
    --paper:#1E1E1E; --on-paper:#F4F2EE; --paper-hi:#000000; --warm:#8A6526;
    --hover:rgba(30,30,30,.06); --hover-2:rgba(30,30,30,.10); --well:rgba(255,255,255,.62); --track:rgba(30,30,30,.10);

  .sidebar.lumen-ind::after{ content:''; position:absolute; top:var(--ind-t); left:var(--ind-l); right:var(--ind-r); bottom:var(--ind-b); border-radius:12px; background:var(--paper); box-shadow:0 8px 18px -8px rgba(0,0,0,.55); z-index:0; pointer-events:none;

<script>
/* Shared sign-in and shared storage for Ascensor Collections.
   Uses the same Supabase project and accounts as AMC Receivables. The client list and
   everything entered here live in the "collections_docs" table, readable only by active,
   signed-in team members. Nothing about clients is stored inside this file.
   Without the sign-in library (for example the file opened offline) the page runs as an
   empty local workspace, the same way AMC Receivables does. */
(function () {
  'use strict';
  var TABLE = 'collections_docs';
  var cfg = window.AMC_SUPABASE_CONFIG;
  var cloud = !!(cfg && cfg.url && cfg.anonKey && cfg.url.indexOf('YOUR_SUPABASE_URL') === -1 && window.supabase && typeof window.supabase.createClient === 'function');
  var st = window.LumenCloud = { mode: 'local', reason: '', sb: null, session: null, profile: null, role: '', isAdmin: false, canEdit: false, seedCount: 0, ready: null };
  if (!cloud) { st.ready = Promise.resolve(st); return; }
  document.body.classList.add('lumen-locked');
  var sb = st.sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  st.ready = (async function () {
    try {
      var res = await sb.auth.getSession(), session = res.data && res.data.session;
      if (!session) { st.mode = 'gate'; st.reason = 'signed-out'; return st; }
      var pr = await sb.from('profiles').select('*, roles:role_id(id,code,name)').eq('id', session.user.id).maybeSingle();
      if (pr.error || !pr.data) { st.mode = 'gate'; st.reason = 'no-profile'; return st; }
      if (pr.data.status !== 'active' || !pr.data.profile_completed) { st.mode = 'gate'; st.reason = 'not-ready'; return st; }
      st.session = session; st.profile = pr.data;
      st.role = (pr.data.roles && pr.data.roles.code) || '';
      st.isAdmin = st.role === 'admin'; st.canEdit = st.isAdmin || st.role === 'editor';
      st.mode = 'cloud';
    } catch (e) { st.mode = 'gate'; st.reason = 'error'; }
    return st;
  })();

  /* A small document store with the same shape the page already uses (collection / doc / onSnapshot). */
  var cache = {}, subs = {}, sig = {};
  function bucket(name) { return cache[name] || (cache[name] = new Map()); }
  function snap(name) { var docs = []; bucket(name).forEach(function (data, id) { docs.push({ id: id, data: function () { return data; } }); }); return { docs: docs }; }
  function emit(name) { (subs[name] || []).forEach(function (cb) { try { cb(snap(name)); } catch (e) {} }); }
  function applySeed() {
    var sites = []; bucket('seedSites').forEach(function (d) { sites.push(d); });
    sites.sort(function (a, b) { return (a._order || 0) - (b._order || 0); });
    var meta = bucket('seedMeta').get('meta') || {};
    SEED = { sites: sites, months: Array.isArray(meta.months) ? meta.months : [], generatedAt: meta.generatedAt || '' };
    st.seedCount = sites.length;
  }
  async function loadAll() {
    var rows = [], from = 0, page = 1000;
    for (;;) {
      var r = await sb.from(TABLE).select('collection,id,data').order('collection').order('id').range(from, from + page - 1);
      if (r.error) throw r.error;
      rows = rows.concat(r.data || []);
      if (!r.data || r.data.length < page) break;
      from += page;
    }
    var next = {};
    rows.forEach(function (row) { (next[row.collection] || (next[row.collection] = new Map())).set(row.id, row.data || {}); });
    var names = {}, changed = [];
    Object.keys(cache).concat(Object.keys(next)).forEach(function (n) { names[n] = 1; });
    Object.keys(names).forEach(function (n) {
      var m = next[n] || new Map(), s = JSON.stringify(Array.from(m.entries()));
      if (sig[n] !== s) { sig[n] = s; changed.push(n); }
      cache[n] = m;
    });
    applySeed();
    return changed;
  }
  /* A refused save (review-only access): note it, then put the screen back to what is really stored. */
  var undoT = 0;
  function denied() {
    st.deniedAt = Date.now();
    clearTimeout(undoT);
    undoT = setTimeout(function () { ['invoices', 'payments', 'siteOverrides', 'customSites', 'settings'].forEach(emit); }, 600);
  }
  async function write(name, id, data, merge) {
    var cur = bucket(name).get(id), next = merge ? Object.assign({}, cur || {}, data) : Object.assign({}, data);
    var r = await sb.from(TABLE).upsert({ collection: name, id: String(id), data: next });
    if (r.error) { denied(); throw r.error; }
    bucket(name).set(String(id), next); sig[name] = null; emit(name);
  }
  async function remove(name, id) {
    if (!st.canEdit) { denied(); throw new Error('Review-only access'); }
    var r = await sb.from(TABLE).delete().eq('collection', name).eq('id', String(id));
    if (r.error) { denied(); throw r.error; }
    bucket(name).delete(String(id)); sig[name] = null; emit(name);
  }
  var api = {
    collection: function (name) {
      return {
        onSnapshot: function (cb) { (subs[name] || (subs[name] = [])).push(cb); Promise.resolve().then(function () { cb(snap(name)); }); return function () {}; },
        get: async function () { return snap(name); },
        add: async function (rec) { var id = name + '_' + Date.now() + '_' + Math.floor(Math.random() * 1e6); await write(name, id, rec, false); return { id: id }; },
        doc: function (id) {
          return {
            set: function (data, opts) { return write(name, id, data, !!(opts && opts.merge)); },
            update: function (patch) { return write(name, id, patch, true); },
            delete: function () { return remove(name, id); }
          };
        }
      };
    }
  };
  /* Pick up teammates' changes when the tab is looked at again, and every two minutes. */
  var busy = false;
  async function refresh() {
    if (busy || st.mode !== 'cloud' || document.hidden) return;
    busy = true;
    try {
      var changed = await loadAll(), seedChanged = changed.indexOf('seedSites') !== -1 || changed.indexOf('seedMeta') !== -1;
      changed.forEach(function (n) { if (n !== 'seedSites' && n !== 'seedMeta') emit(n); });
      if (seedChanged && typeof rerender === 'function' && !document.querySelector('.modal')) rerender();
    } catch (e) {} finally { busy = false; }
  }
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('focus', refresh);
  setInterval(refresh, 120000);

  /* Admin only: load the client list file into the shared store (replaces the current list). */
  st.importSeed = async function (payload) {
    var sites = payload.sites, rows = sites.map(function (s, i) { return { collection: 'seedSites', id: String(s.id), data: Object.assign({}, s, { _order: i }) }; });
    for (var i = 0; i < rows.length; i += 20) {
      var r = await sb.from(TABLE).upsert(rows.slice(i, i + 20));
      if (r.error) throw r.error;
    }
    var m = await sb.from(TABLE).upsert({ collection: 'seedMeta', id: 'meta', data: { months: payload.months || [], generatedAt: payload.generatedAt || '', importedAt: new Date().toISOString() } });
    if (m.error) throw m.error;
    var keep = {}, stale = []; rows.forEach(function (x) { keep[x.id] = 1; });
    bucket('seedSites').forEach(function (_, id) { if (!keep[id]) stale.push(id); });
    if (stale.length) { var d = await sb.from(TABLE).delete().eq('collection', 'seedSites').in('id', stale); if (d.error) throw d.error; }
    await loadAll();
    return rows.length;
  };

  /* The page asks for its database through window.claude.use('db'); answer with the shared store. */
  window.claude = {
    use: async function (cap) {
      if (cap !== 'db') throw new Error('Not available here');
      var s = await st.ready;
      if (s.mode !== 'cloud') throw new Error('Not signed in');
      await loadAll();
      return api;
    }
  };
})();
</script>

   Ascensor Collections — single-page collection management tool
   Sections: helpers, state/capabilities, data model, router, views,
   forms (invoice/payment), exports (excel/print), charts.

/* ---------------------------- Helpers ---------------------------------- */

const todayISO = () => new Date().toISOString().slice(0, 10);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtMoney(n, currency) {
  if (n == null || isNaN(n)) return '<span class="faint">—</span>';
  const neg = n < 0;
  const v = Math.abs(round2(n)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `${neg ? '−' : ''}${currency ? currency + ' ' : ''}${v}`;
}
function fmtNum(n) { return (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

// ------------------------- Functional currency (MVR) -------------------------
// The whole app displays every figure in one "functional" currency (MVR) so amounts are always
// comparable at a glance. A contract/invoice/payment can still be recorded in USD — that's what's
// actually billed/paid, and stays on the record unchanged — but wherever a figure is SHOWN, it's
// converted at the functional rate (MVR per 1 USD) so everything reads consistently as MVR. The rate
// itself is editable from the Data & Backup page.
function functionalRate() { return (AppState.settings && AppState.settings.functionalRate) || 15.42; }
function toFunctional(amount, currency) { return currency === 'USD' ? round2((Number(amount) || 0) * functionalRate()) : round2(Number(amount) || 0); }
// Converts to the functional currency, then formats as MVR. Use this (not fmtMoney) for any amount
// that reflects a saved record — the one exception is a live "what am I about to enter" preview
// inside a form, where showing the raw currency the user is actively typing is clearer.
function fmtMoneyF(amount, currency) { return fmtMoney(toFunctional(amount, currency), 'MVR'); }
async function saveFunctionalRate(rate) {
  AppState.settings = { ...AppState.settings, functionalRate: rate };
  if (AppState.dbReady && AppState.db) {
    try { await AppState.db.collection('settings').doc('app').set(AppState.settings, { merge: true }); return; }
    catch (e) { toast('Could not sync — saved locally only for this session.'); }
  }
  persistLocal();
}

const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function monthLabel(ym) { const [y, m] = ym.split('-'); return `${MONTH_NAMES[parseInt(m, 10) - 1]} ${y}`; }
function isIsoDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}/.test(s); }
function fmtDate(s) {
  if (!s) return '<span class="faint">—</span>';
  if (isIsoDate(s)) {
    const d = new Date(s + 'T00:00:00');
    if (!isNaN(d)) return `${String(d.getDate()).padStart(2, '0')} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  }
  return esc(s);
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function addDaysIso(iso, n) {
  if (!iso || !isIsoDate(iso)) return null;
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

// A short, deterministic 1-2 letter initial for a client name, used to give the site detail page a
// small colored badge instead of a bare heading — purely a display touch, not stored anywhere.
function initialsOf(name) {
  const words = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

/* ------------------------------ Pagination -------------------------------- */

const PAGE_SIZE = 50;
const _pageState = {};
function getPage(key) { return _pageState[key] || 1; }
function setPage(key, p) { _pageState[key] = Math.max(1, p); }
function paginateRows(key, rows, perPage = PAGE_SIZE) {
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / perPage));
  const page = Math.min(Math.max(1, getPage(key)), pages);
  setPage(key, page);
  const start = (page - 1) * perPage;
  return { pageRows: rows.slice(start, start + perPage), page, pages, total, start, end: Math.min(start + perPage, total) };
}
function paginationBarHtml(key, state, fnName) {
  if (!state.total) return '';
  return `
    <div class="pagination no-print">
      <span class="faint">Showing ${state.start + 1}–${state.end} of ${state.total}</span>
      <div class="row" style="gap:6px;">
        <button class="btn btn-sm" ${state.page <= 1 ? 'disabled' : ''} onclick="gotoPage('${key}', ${state.page - 1}, '${fnName}')">‹ Prev</button>
        <span class="mono" style="font-size:12px;padding:0 4px;">Page ${state.page} / ${state.pages}</span>
        <button class="btn btn-sm" ${state.page >= state.pages ? 'disabled' : ''} onclick="gotoPage('${key}', ${state.page + 1}, '${fnName}')">Next ›</button>
      </div>
    </div>`;
}
function gotoPage(key, p, fnName) { setPage(key, p); window[fnName](); }

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function statusPill(status) {
  const map = {

  };
  return `<span class="pill pill-${map[status] || 'neutral'}">${esc(status)}</span>`;
}
function projectPill(status) {

  const cls = goodOnes.includes(status) ? 'success' : badOnes.includes(status) ? 'danger' : 'neutral';
  return `<span class="pill pill-${cls}">${esc(status)}</span>`;
}

/* --------------------- Capabilities: db + downloads --------------------- */

const AppState = {
  invoices: [],   // {id, siteId, date, invoiceNo, amount, gstAmount, totalAmount, currency, notes, createdAt}
  payments: [],   // {id, siteId, invoiceRef, date, amount, currency, reference, notes, createdAt}
  siteOverrides: {}, // {siteId: {liftBrand, liftModel, liftStops, liftSpeed, liftLoad, mobile, email, statementNotes, stageOverrides}}
  customSites: [], // sites/customers added in-app (same shape as a SEED site record)
  settings: { functionalRate: 15.42 }, // app-wide settings — currently just the MVR-per-USD functional rate
  dbReady: false,
  db: null,
  downloads: null,
};

// -------------------- Local (browser-only) persistence fallback --------------------
// When this copy has no live workspace database (e.g. the downloaded standalone HTML file opened
// directly in a browser, outside claude.ai), there is nothing else keeping data around — without
// this, every edit lives only in the page's in-memory AppState and is lost the moment the page is
// reloaded or reopened. To fix that, this browser's localStorage is used as a per-device save file:
// every mutation writes the current invoices/payments/siteOverrides/customSites/settings to it, and
// on startup (only when there is no db connection) that snapshot is loaded back in before the first
// render. This is scoped to this exact page/origin — it does not sync across devices or browsers,
// which is what Backup/Restore (JSON download) on the Data & Backup page is for.
const LOCAL_STORAGE_KEY = 'ascensor-collections-local-data-v1';
function persistLocal() {
  if (AppState.dbReady) return; // the real workspace database is the source of truth when present
  try {
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
      invoices: AppState.invoices, payments: AppState.payments,
      siteOverrides: AppState.siteOverrides, customSites: AppState.customSites,
      settings: AppState.settings, savedAt: new Date().toISOString(),
    }));
  } catch (e) { /* storage unavailable (private browsing, quota) — edits still work for this session */ }
}
function loadLocalIntoState() {
  try {
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return;
    if (Array.isArray(data.invoices)) AppState.invoices = data.invoices;
    if (Array.isArray(data.payments)) AppState.payments = data.payments;
    if (data.siteOverrides && typeof data.siteOverrides === 'object') AppState.siteOverrides = data.siteOverrides;
    if (Array.isArray(data.customSites)) AppState.customSites = data.customSites;
    if (data.settings && typeof data.settings === 'object') AppState.settings = { functionalRate: 15.42, ...data.settings };
    AppState.localSavedAt = data.savedAt || null;
  } catch (e) { /* corrupt/unreadable local data — start from a clean slate rather than crash */ }
}

async function initCapabilities() {
  if (window.claude && window.claude.use) {
    try {
      AppState.db = await window.claude.use('db');
    } catch (e) { AppState.db = null; }
    try {
      AppState.downloads = await window.claude.use('downloads');
    } catch (e) { AppState.downloads = null; }
  }
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if (AppState.db) {
    AppState.dbReady = true;
    dot.classList.remove('off');
    label.textContent = 'Synced';
    AppState.db.collection('invoices').onSnapshot(snap => {
      AppState.invoices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      rerender();
    }, () => {});
    AppState.db.collection('payments').onSnapshot(snap => {
      AppState.payments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      rerender();
    }, () => {});
    AppState.db.collection('siteOverrides').onSnapshot(snap => {
      const merged = {};
      snap.docs.forEach(d => { merged[d.id] = d.data(); });
      AppState.siteOverrides = merged;
      rerender();
    }, () => {});
    AppState.db.collection('customSites').onSnapshot(snap => {
      AppState.customSites = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      rerender();
    }, () => {});
    AppState.db.collection('settings').onSnapshot(snap => {
      const doc = snap.docs.find(d => d.id === 'app');
      AppState.settings = { functionalRate: 15.42, ...(doc ? doc.data() : {}) };
      rerender();
    }, () => {});
  } else {
    dot.classList.add('off');
    label.textContent = 'Saved on this device';
    loadLocalIntoState();
  }
}

/* ------------------------------ Data model ------------------------------ */

function applyOverrides(site) {
  const ov = AppState.siteOverrides[site.id];
  if (!ov) return { ...site, documents: site.documents || [] };
  const pick = (k) => (ov[k] != null && ov[k] !== '' ? ov[k] : site[k]);
  return {
    ...site,
    liftBrand: pick('liftBrand'), liftModel: pick('liftModel'), liftStops: pick('liftStops'),
    liftSpeed: pick('liftSpeed'), liftLoad: pick('liftLoad'),
    mobile: pick('mobile'), email: pick('email'),
    contractInclGst: pick('contractInclGst'), contractExclGst: pick('contractExclGst'), gstAmount: pick('gstAmount'),
    gstRatePct: pick('gstRatePct'), currency: pick('currency'),
    contractSignDate: pick('contractSignDate'), handoverDate: pick('handoverDate'), projectStatus: pick('projectStatus'),
    statementNotes: ov.statementNotes || null,
    stageOverrides: ov.stageOverrides || null,
    documents: ov.documents || site.documents || [],
  };
}
// A factory reset can't literally erase the bundled source-workbook contracts (they ship as fixed
// code, not data), so it hides them instead via the same per-site override record used for every
// other site-level edit — everywhere in the app that lists or looks up sites treats a hidden seed
// site as if it no longer exists.
function isSeedHidden(id) { return !!(AppState.siteOverrides[id] && AppState.siteOverrides[id].hidden); }
// isSeedHidden() checks the same per-site "hidden" override flag regardless of whether the site is
// one of the original workbook contracts or one added later via "Add customer" — deleting a customer
// from the Clients & Sites page (see deleteCustomer) uses this same soft-hide mechanism either way,
// so both kinds of customer disappear from the app the same way and can both be brought back by a
// factory reset.
function allSites() { return [...SEED.sites, ...AppState.customSites].filter(s => !isSeedHidden(s.id)); }
function baseSiteById(id) { return SEED.sites.find(s => s.id === id) || AppState.customSites.find(s => s.id === id); }
function getSite(id) {
  if (isSeedHidden(id)) return undefined;
  const raw = baseSiteById(id);
  return raw ? applyOverrides(raw) : undefined;
}

async function saveSiteOverride(siteId, patch) {
  const merged = { ...(AppState.siteOverrides[siteId] || {}), ...patch };
  AppState.siteOverrides[siteId] = merged;
  if (AppState.dbReady && AppState.db) {
    try {
      await AppState.db.collection('siteOverrides').doc(siteId).set(merged, { merge: true });
      return;
    } catch (e) {
      try { await AppState.db.collection('siteOverrides').doc(siteId).update(patch); return; }
      catch (e2) { toast('Could not sync — saved locally only for this session.'); }
    }
  }
  persistLocal();
}

/* ------------------------------ Site documents (link-only) ------------------------------ */

function normalizeDocUrl(url) {
  let u = (url || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

async function addSiteDocument(siteId, title, url) {
  const site = getSite(siteId);
  const docs = (site.documents || []).slice();
  docs.push({
    id: 'doc' + Date.now() + '_' + Math.floor(Math.random() * 1e4),
    title: title || 'Untitled document',
    url,
    addedAt: new Date().toISOString(),
  });
  await saveSiteOverride(siteId, { documents: docs });
}

async function removeSiteDocument(siteId, docId) {
  const site = getSite(siteId);
  const docs = (site.documents || []).filter(d => d.id !== docId);
  await saveSiteOverride(siteId, { documents: docs });
  rerender();
}

function siteInvoices(siteId) {
  return AppState.invoices.filter(i => i.siteId === siteId).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function sitePayments(siteId) {
  return AppState.payments.filter(p => p.siteId === siteId).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

// Sum of "amount actually invoiced to date" for a site with a defined payment-stage schedule — the
// historical invoiceAmount recorded against each stage (from the imported workbook), overlaid with a
// live in-app invoice's amount for a stage that had none yet, plus any live invoice that doesn't
// correspond to an existing stage at all (a change order, a top-up). This mirrors the invoiceAmount
// resolution statementStageRows() does when building the statement table, but doesn't need paid/due
// figures, so it has no circular dependency on siteFinancials() below (statementStageRows() itself
// calls siteFinancials() for treatAsFullyPaid). If the stage-matching rules ever change, keep both in
// sync.
function stageInvoicedTotal(site) {
  const invoices = siteInvoices(site.id);
  const liveByNo = {}, liveByStage = {};
  invoices.forEach(i => {
    if (i.invoiceNo) liveByNo[normText(i.invoiceNo)] = i;
    if (i.stage) (liveByStage[normText(i.stage)] = liveByStage[normText(i.stage)] || []).push(i);
  });
  const base = (site.paymentStages && site.paymentStages.length) ? site.paymentStages : [];
  const overrides = site.stageOverrides || {};
  const maxOverrideIdx = Object.keys(overrides).reduce((m, k) => Math.max(m, parseInt(k, 10) || 0), -1);
  const count = Math.max(base.length, maxOverrideIdx + 1);
  const usedInvoiceIds = new Set();
  let total = 0;
  for (let idx = 0; idx < count; idx++) {
    const ov = overrides[idx];
    if (ov && ov.deleted) continue;
    const st = base[idx] || {};
    let linked = [];
    if (st.stage && liveByStage[normText(st.stage)]) linked = liveByStage[normText(st.stage)];
    else if (st.invoiceNo && liveByNo[normText(st.invoiceNo)]) linked = [liveByNo[normText(st.invoiceNo)]];
    linked.forEach(inv => usedInvoiceIds.add(inv.id));
    let invoiceAmount = st.invoiceAmount != null ? st.invoiceAmount : (linked[0] ? linked[0].amount : null);
    if (ov && ov.invoiceAmount !== undefined) invoiceAmount = ov.invoiceAmount;
    if (invoiceAmount != null) total += Number(invoiceAmount) || 0;
  }
  invoices.forEach(inv => { if (!usedInvoiceIds.has(inv.id)) total += Number(inv.amount) || 0; });
  return round2(total);
}

// site.paymentStatus is a snapshot captured at import/creation time — it never updates itself as
// live invoices and payments are posted through the app, so a site that's since been fully paid can
// still show its old "Unpaid" pill. Everywhere the status is actually displayed derives it fresh from
// the current siteFinancials() figures instead. "Fully Paid" is judged against the whole contract
// (totalToCollect), not just what's been invoiced so far — a site can have its billed invoices fully
// settled (outstanding = 0) while stages still remain to be invoiced, which isn't "fully paid" yet.
function liveSitePaymentStatus(f) {
  if (!(f.contractValue > 0) && !(f.invoicedAmount > 0)) return 'Unknown';
  if (f.totalToCollect <= 0.01) return 'Fully Paid';
  if (f.paidTotal > 0) return 'Partially Paid';
  return 'Unpaid';
}

function siteFinancials(site) {
  const hasStages = !!(site.paymentStages && site.paymentStages.length);
  const contractValue = round2(site.contractInclGst || 0);
  const liveInvoices = siteInvoices(site.id);
  const allLiveInvoiced = round2(liveInvoices.reduce((s, i) => s + (Number(i.amount) || 0), 0));
  // "Invoiced amount" is strictly what has actually been billed to date — it only grows when an
  // invoice is issued (live in-app, or already reflected in the imported payment-stage schedule).
  // Unlike the fixed contract value, it can legitimately sit below the contract total until every
  // stage has been billed — see "Total contract value to be collected" below for the figure that
  // tracks the whole remaining contract regardless of how much of it has been invoiced yet.
  const rawInvoicedAmount = hasStages ? stageInvoicedTotal(site) : allLiveInvoiced;
  const extraPaid = sitePayments(site.id).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const paidTotal = round2((site.openingPaid || 0) + extraPaid);
  // Some imported historical stages recorded a payment without ever capturing that stage's own
  // invoice amount in the source workbook — money was never collected without first being billed, so
  // treat "invoiced" as never less than what's actually been paid rather than showing a nonsensical
  // negative outstanding for those older records.
  const invoicedAmount = round2(Math.max(rawInvoicedAmount, paidTotal));
  const outstanding = round2(invoicedAmount - paidTotal); // billed but not yet paid
  const totalToCollect = round2(contractValue - paidTotal); // whole contract, invoiced or not
  const pays = sitePayments(site.id);
  const importedDates = (site.ledger || []).map(l => l.date).filter(Boolean);
  const allDates = pays.map(p => p.date).concat(importedDates).filter(Boolean).sort();
  const lastActivity = allDates.length ? allDates[allDates.length - 1] : (site.contractSignDate && isIsoDate(site.contractSignDate) ? site.contractSignDate : null);
  // invoicedTotal is kept as an alias of invoicedAmount for any older call site that hasn't been
  // renamed yet — the two always match.
  return { contractValue, invoicedAmount, invoicedTotal: invoicedAmount, paidTotal, outstanding, totalToCollect, lastActivity };
}

function siteMergedLedger(site) {
  const rows = [];
  (site.ledger || []).forEach(e => rows.push({ date: e.date, invoiceNo: e.ref || '—', type: 'Imported', amount: e.amount, notes: 'From legacy records' }));
  siteInvoices(site.id).forEach(i => rows.push({ date: i.date, invoiceNo: i.invoiceNo || '—', type: 'Invoice', amount: i.amount, notes: i.notes || '' }));
  sitePayments(site.id).forEach(p => {
    // A payment's own "reference" field is a payment method/note (bank transfer, cheque no.), not an
    // invoice number — so show the invoice it was actually applied against when one is linked.
    const inv = p.invoiceId ? AppState.invoices.find(x => x.id === p.invoiceId) : null;
    rows.push({ date: p.date, invoiceNo: inv ? (inv.invoiceNo || '—') : (p.reference || '—'), type: 'Payment', amount: p.amount, notes: p.notes || '' });
  });
  rows.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  return rows;
}

function clientNameOf(site) { return site.client; }
function allClients() { return [...new Set(allSites().map(s => s.client))].sort(); }
function sitesForClient(name) { return allSites().filter(s => s.client === name).map(s => getSite(s.id)); }

// Month range covering both imported history and any live entries
function allMonthsRange() {
  const set = new Set(SEED.months);
  AppState.payments.forEach(p => { if (p.date) set.add(p.date.slice(0, 7)); });
  AppState.invoices.forEach(i => { if (i.date) set.add(i.date.slice(0, 7)); });
  const arr = [...set].filter(x => /^\d{4}-\d{2}$/.test(x)).sort();
  return arr;
}

function monthlyAmountForSite(site, ym) {
  let v = site.monthly[ym] || 0;
  sitePayments(site.id).forEach(p => { if (p.date && p.date.slice(0, 7) === ym) v += Number(p.amount) || 0; });
  return round2(v);
}

function agingBucket(days) {
  if (days == null) return 'Current';
  if (days >= 90) return '90+ days';
  if (days >= 60) return '60–89 days';
  if (days >= 30) return '30–59 days';
  return 'Current';
}

const ROUTES = {
  dashboard: { title: 'Dashboard', sub: 'Live overview of contracts, collections and outstanding balances', render: renderDashboard },
  sites: { title: 'Clients & Sites', sub: 'Every contract on the books — search, filter, drill in', render: renderSites },
  site: { title: 'Site', sub: '', render: renderSiteDetail },
  invoices: { title: 'Invoices', sub: 'Invoices issued since go-live (historical invoice numbers live on each site ledger)', render: renderInvoices },
  payments: { title: 'Payments', sub: 'Payments posted since go-live', render: renderPayments },
  monthly: { title: 'Monthly Breakdown', sub: 'Collections received by month — filter by client or site and export', render: renderMonthly },
  statements: { title: 'Customer Statements', sub: 'Generate the statement you send each client, individually or in bulk', render: renderStatements },
  outstanding: { title: 'Outstanding', sub: 'Live aging & balance-due report across the whole portfolio', render: renderOutstanding },
  data: { title: 'Data & Backup', sub: 'Where your data lives, backups, bulk import/export, and a reset switch', render: renderDataPage },
};

function parseHash() {
  const h = location.hash.replace(/^#/, '') || 'dashboard';
  const [route, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  return { route: ROUTES[route] ? route : 'dashboard', params };
}

function navigate(route, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  location.hash = route + qs;
}

function rerender() {
  const { route, params } = parseHash();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === route));
  const def = ROUTES[route];
  document.getElementById('pageTitle').textContent = def.title;
  document.getElementById('pageSub').textContent = def.sub;
  document.getElementById('topbarActions').innerHTML = '';
  const content = document.getElementById('content');
  content.innerHTML = '';
  def.render(content, params);
  const d = new Date();
  document.getElementById('asAtLabel').textContent = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

window.addEventListener('hashchange', rerender);

/* ------------------------------ UI: generic ------------------------------ */

function siteOptionsHtml(selectedId) {
  const sorted = [...allSites()].sort((a, b) => a.client.localeCompare(b.client) || a.site.localeCompare(b.site));
  return sorted.map(s => `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${esc(s.client)} — ${esc(s.site)} (${s.currency})</option>`).join('');
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

function openModal(title, bodyHtml, footHtml) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button class="icon-btn" onclick="closeModal()" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">${footHtml}</div>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });
}

// A lightweight in-app confirmation dialog for destructive actions (delete invoice/payment/customer)
// — used instead of the native confirm() dialog, which a published Artifact page can't reliably show.
function openConfirmModal(title, message, confirmLabel, onConfirm) {
  const body = `<p style="margin:0;">${esc(message)}</p>`;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="confirmActionBtn">${esc(confirmLabel || 'Delete')}</button>`;
  openModal(title, body, foot);
  document.getElementById('confirmActionBtn').addEventListener('click', async () => {
    closeModal();
    await onConfirm();
  });
}

function openInvoiceModal(preselectSiteId, onDone) {
  const body = `
    <div class="form-grid">
      <div class="field span2">
        <label>Site / contract</label>
        <select id="fSite">${siteOptionsHtml(preselectSiteId)}</select>
      </div>

      <div class="field"><label>Invoice no.</label><input type="text" id="fInvNo" placeholder="e.g. INV-1802"></div>
      <div class="field"><label>Due date</label><input type="date" id="fDueDate" value="${addDaysIso(todayISO(), 30)}"></div>
      <div class="field"><label>Currency</label><select id="fCurrency"><option>MVR</option><option>USD</option></select></div>
      <div class="field"><label>Amount (incl. GST)</label><input type="number" step="0.01" id="fAmountIncl" placeholder="0.00"></div>
      <div class="field"><label>GST %</label><input type="number" step="0.01" id="fGstPct" placeholder="0"></div>
      <div class="field span2">
        <label>Payment stage</label>
        <input type="text" id="fStage" list="fStageList" placeholder="e.g. When shipment is ready 25% (optional)">
        <datalist id="fStageList"></datalist>
      </div>
      <div class="field span2"><label>Notes</label><textarea id="fNotes" placeholder="Optional"></textarea></div>
    </div>
    <div class="search-note" id="fPreview"></div>
    <div class="search-note">Tagging a payment stage links this invoice to that line on the customer's statement — it updates there automatically.</div>
  `;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="fSubmit">Issue invoice</button>`;
  openModal('Issue invoice', body, foot);

  const siteSel = document.getElementById('fSite');
  const gstInput = document.getElementById('fGstPct');
  const currencySel = document.getElementById('fCurrency');
  const dateInput = document.getElementById('fDate');
  const dueDateInput = document.getElementById('fDueDate');
  const syncGst = () => { const s = getSite(siteSel.value); if (s && s.gstRatePct != null && !gstInput.dataset.touched) gstInput.value = s.gstRatePct; };
  const syncCurrency = () => { const s = getSite(siteSel.value); if (s && s.currency && !currencySel.dataset.touched) currencySel.value = s.currency; };
  const refreshStageList = () => {
    const s = getSite(siteSel.value);
    const stages = [...new Set(((s && s.paymentStages) || []).map(st => st.stage).filter(Boolean))];
    document.getElementById('fStageList').innerHTML = stages.map(st => `<option value="${esc(st)}">`).join('');
  };
  // Default the due date to 30 days after the invoice date, unless the user has typed their own.
  dueDateInput.addEventListener('input', () => { dueDateInput.dataset.touched = '1'; });
  dateInput.addEventListener('input', () => { if (!dueDateInput.dataset.touched && dateInput.value) dueDateInput.value = addDaysIso(dateInput.value, 30); });
  syncGst();
  syncCurrency();
  refreshStageList();
  siteSel.addEventListener('change', syncGst);
  siteSel.addEventListener('change', syncCurrency);
  siteSel.addEventListener('change', refreshStageList);
  siteSel.addEventListener('change', updatePreview);
  currencySel.addEventListener('change', () => { currencySel.dataset.touched = '1'; updatePreview(); });
  gstInput.addEventListener('input', () => { gstInput.dataset.touched = '1'; updatePreview(); });
  document.getElementById('fAmountIncl').addEventListener('input', updatePreview);
  function updatePreview() {
    const total = parseFloat(document.getElementById('fAmountIncl').value) || 0;
    const pct = parseFloat(gstInput.value) || 0;
    const ex = round2(total / (1 + pct / 100));
    const gst = round2(total - ex);
    document.getElementById('fPreview').textContent = `Amount excl. GST: ${fmtMoney(ex, currencySel.value).replace(/<[^>]+>/g, '')} · GST amount: ${fmtMoney(gst, currencySel.value).replace(/<[^>]+>/g, '')}`;
  }
  updatePreview();

  document.getElementById('fSubmit').addEventListener('click', async () => {
    const site = getSite(siteSel.value);
    const total = parseFloat(document.getElementById('fAmountIncl').value) || 0;
    const pct = parseFloat(gstInput.value) || 0;
    if (total <= 0) { toast('Enter an invoice amount.'); return; }
    const ex = round2(total / (1 + pct / 100));
    const gst = round2(total - ex);
    const rec = {
      siteId: site.id, date: document.getElementById('fDate').value || todayISO(),
      invoiceNo: document.getElementById('fInvNo').value.trim(),
      dueDate: dueDateInput.value || null,
      amount: total, amountExGst: ex, gstAmount: gst, gstPct: pct,
      stage: document.getElementById('fStage').value.trim() || null,
      currency: currencySel.value, notes: document.getElementById('fNotes').value.trim(),
      createdAt: new Date().toISOString(),
    };
    await saveRecord('invoices', rec);
    closeModal();
    toast(`Invoice issued for ${site.client} — ${site.site}. Dashboard updated.`);
    rerender();
    if (onDone) onDone();
  });
}

  const currencySel = document.getElementById('pCurrency');

  function refreshInvoices() {
    const invs = siteInvoices(siteSel.value);
    invSel.innerHTML = '<option value="">General / not linked</option>' + invs.map(i => {

      return `<option value="${i.id}">${esc(i.invoiceNo || i.id)} — ${fmtMoney(i.amount, i.currency || '').replace(/<[^>]+>/g, '')} (due ${fmtMoney(due, i.currency || '').replace(/<[^>]+>/g, '')})</option>`;
    }).join('');

    suggestAmount();

  // Suggest the invoice's own remaining balance as the amount received — a convenience default the
  // user can still type over; it never clobbers an amount they've already entered by hand.
  function suggestAmount() {
    if (amountInput.dataset.touched) return;
    const inv = siteInvoices(siteSel.value).find(i => i.id === invSel.value);

      createdAt: new Date().toISOString(),
    };
    await saveRecord('payments', rec);
    closeModal();
    toast(`Payment posted for ${site.client} — ${site.site}. Dashboard updated.`);
    rerender();
    if (onDone) onDone();
  });
}

/* --------------------------- Edit invoice due date ------------------------- */

// idxRaw comes straight from a row's `idx` (see statementStageRows / allInvoiceRows): either a
// numeric payment-stage index (as a string, from the onclick attribute) or the string key
// "live_<invoiceId>" used for an invoice that isn't tied to any predefined stage. A numeric idx is
// always saved as a stage override (it wins over a linked live invoice's own due date when the
// statement/schedule is rendered — see statementStageRows), so that's the one true place to edit it
// even when the stage happens to be linked to a live invoice; a non-numeric idx has no stage row to
// override, so the due date is saved directly on the live invoice record instead.
function openEditDueDateModal(siteId, idxRaw, liveInvoiceId, currentDueDate, onDone) {
  const site = getSite(siteId);
  if (!site) return;
  const isStageIdx = /^-?\d+$/.test(String(idxRaw));
  const row = statementStageRows(site).find(r => String(r.idx) === String(idxRaw));
  const label = row ? (row.stage || row.invoiceNo || 'this invoice') : 'this invoice';
  const body = `
    <div class="form-grid">
      <div class="field span2"><label>Invoice</label><div style="margin-top:2px;font-weight:600;">${esc(label)}</div></div>
      <div class="field"><label>Due date</label><input type="date" id="edDueDate" value="${esc(currentDueDate || '')}"></div>
    </div>
  `;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="edSubmit">Save due date</button>`;
  openModal('Edit due date', body, foot);
  document.getElementById('edSubmit').addEventListener('click', async () => {
    const newDate = document.getElementById('edDueDate').value || null;
    if (isStageIdx) {
      const idx = parseInt(idxRaw, 10);
      const stageOverrides = { ...(site.stageOverrides || {}) };
      stageOverrides[idx] = { ...(stageOverrides[idx] || {}), dueDate: newDate };
      await saveSiteOverride(siteId, { stageOverrides });
    } else if (liveInvoiceId) {
      // Send the whole record (not just the changed field) — a plain object-store `set` can replace
      // a document instead of merging it, and this way the write is safe either way.
      const existing = AppState.invoices.find(i => i.id === liveInvoiceId);
      await updateRecord('invoices', liveInvoiceId, { ...(existing || {}), dueDate: newDate });
    }
    closeModal();
    toast('Due date updated.');
    if (onDone) onDone(); else rerender();
  });
}

/* --------------------------- Edit / delete an invoice ---------------------- */

// Same idx convention as openEditDueDateModal: a numeric idx is a payment-stage row — edited via a
// stage override, which is what actually wins when the row is rendered (see statementStageRows) even
// if a live invoice happens to be linked to that stage. A non-numeric "live_<id>" idx has no stage
// row backing it at all, so it's edited directly on the live invoice record.
function openEditInvoiceModal(siteId, idxRaw, liveInvoiceId, onDone) {
  const site = getSite(siteId);
  if (!site) return;
  const isStageIdx = /^-?\d+$/.test(String(idxRaw));
  const row = statementStageRows(site).find(r => String(r.idx) === String(idxRaw));
  if (!row) { toast('Could not find that invoice.'); return; }
  const liveInv = liveInvoiceId ? AppState.invoices.find(i => i.id === liveInvoiceId) : null;

  const body = `
    <div class="form-grid">
      <div class="field span2"><label>Payment stage</label><input type="text" id="eiStage" value="${esc(row.stage || '')}" placeholder="Optional"></div>
      <div class="field"><label>Invoice no.</label><input type="text" id="eiInvNo" value="${esc(row.invoiceNo || '')}"></div>
      <div class="field"><label>Invoice date</label><input type="date" id="eiDate" value="${row.invoiceDate || ''}"></div>
      <div class="field"><label>Amount${isStageIdx ? '' : ' (incl. GST)'}</label><input type="number" step="0.01" id="eiAmount" value="${row.invoiceAmount != null ? row.invoiceAmount : ''}"></div>
      ${!isStageIdx ? `<div class="field"><label>GST %</label><input type="number" step="0.01" id="eiGstPct" value="${liveInv && liveInv.gstPct != null ? liveInv.gstPct : (site.gstRatePct != null ? site.gstRatePct : 0)}"></div>` : ''}
      <div class="field"><label>Due date</label><input type="date" id="eiDueDate" value="${row.dueDate || ''}"></div>
    </div>
    ${isStageIdx ? '<div class="search-note">This is a payment-stage line from the sales agreement — editing it updates that stage.</div>' : ''}
  `;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="eiSubmit">Save invoice</button>`;
  openModal('Edit invoice', body, foot);

  document.getElementById('eiSubmit').addEventListener('click', async () => {
    const stage = document.getElementById('eiStage').value.trim() || null;
    const invoiceNo = document.getElementById('eiInvNo').value.trim() || null;
    const invoiceDate = document.getElementById('eiDate').value || null;
    const amount = parseFloat(document.getElementById('eiAmount').value) || 0;
    const dueDate = document.getElementById('eiDueDate').value || null;
    if (amount <= 0) { toast('Enter an invoice amount.'); return; }

    if (isStageIdx) {
      const idx = parseInt(idxRaw, 10);
      const stageOverrides = { ...(site.stageOverrides || {}) };
      stageOverrides[idx] = { ...(stageOverrides[idx] || {}), stage, invoiceNo, invoiceDate, invoiceAmount: amount, dueDate };
      await saveSiteOverride(siteId, { stageOverrides });
    } else if (liveInv) {
      const pct = parseFloat(document.getElementById('eiGstPct').value) || 0;
      const ex = round2(amount / (1 + pct / 100));
      const gst = round2(amount - ex);
      await updateRecord('invoices', liveInv.id, {
        ...liveInv, stage, invoiceNo, date: invoiceDate, amount, amountExGst: ex, gstAmount: gst, gstPct: pct, dueDate,
      });
    }
    closeModal();
    toast('Invoice updated.');
    if (onDone) onDone(); else rerender();
  });
}

function deleteInvoiceRow(siteId, idxRaw, liveInvoiceId, onDone) {
  openConfirmModal('Delete invoice', 'This will permanently remove this invoice from the records. This cannot be undone.', 'Delete', async () => {
    const isStageIdx = /^-?\d+$/.test(String(idxRaw));
    if (isStageIdx) {
      const site = getSite(siteId);
      const idx = parseInt(idxRaw, 10);
      const stageOverrides = { ...(site.stageOverrides || {}) };
      stageOverrides[idx] = { ...(stageOverrides[idx] || {}), deleted: true };
      await saveSiteOverride(siteId, { stageOverrides });
    }
    // Delete the live invoice too whenever one exists — otherwise, if it happened to be linked to a
    // stage that just got hidden above, it would resurface as its own "unmatched" invoice row.
    if (liveInvoiceId) await deleteRecord('invoices', liveInvoiceId);
    toast('Invoice deleted.');
    if (onDone) onDone(); else rerender();
  });
}

/* --------------------------- Edit / delete a payment ------------------------ */

function openEditPaymentModal(siteId, idxRaw, paymentId, onDone) {

      <div class="field"><label>Reference / method</label><input type="text" id="epRef" value="${esc(live.reference || '')}"></div>
      <div class="field span2"><label>Notes</label><textarea id="epNotes">${esc(live.notes || '')}</textarea></div>
    </div>` : `
    <div class="form-grid">
      <div class="field"><label>Payment date</label><input type="date" id="epDate" value="${stageRow.paidDate || ''}"></div>
      <div class="field"><label>Amount received</label><input type="number" step="0.01" id="epAmount" value="${stageRow.paidAmount != null ? stageRow.paidAmount : ''}"></div>
    </div>
    <div class="search-note">This payment comes from the sales-agreement stage schedule — editing it updates that stage's paid amount/date.</div>`;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="epSubmit">Save payment</button>`;
  openModal('Edit payment', body, foot);

  document.getElementById('epSubmit').addEventListener('click', async () => {
    const date = document.getElementById('epDate').value || null;
    const amount = parseFloat(document.getElementById('epAmount').value) || 0;
    if (amount <= 0) { toast('Enter a payment amount.'); return; }
    if (live) {
      const currency = document.getElementById('epCurrency').value;
      const reference = document.getElementById('epRef').value.trim();
      const notes = document.getElementById('epNotes').value.trim();
      await updateRecord('payments', live.id, { ...live, date, amount, currency, reference, notes });

      const idx = parseInt(idxRaw, 10);
      const stageOverrides = { ...(site.stageOverrides || {}) };
      stageOverrides[idx] = { ...(stageOverrides[idx] || {}), paidAmount: amount, paidDate: date };
      await saveSiteOverride(siteId, { stageOverrides });
    }
    closeModal();
    toast('Payment updated.');
    if (onDone) onDone(); else rerender();
  });
}

function deletePaymentRow(siteId, idxRaw, paymentId, onDone) {
  openConfirmModal('Delete payment', 'This will permanently remove this payment from the records. This cannot be undone.', 'Delete', async () => {
    if (paymentId) {
      await deleteRecord('payments', paymentId);
    } else if (idxRaw != null) {
      // A historical stage payment has no separate record of its own — the paid amount/date live
      // right on the stage alongside the invoice, so "deleting" the payment clears just those two
      // fields and leaves the invoice line (and its billed amount) in place.
      const idx = parseInt(idxRaw, 10);
      const site = getSite(siteId);
      const stageOverrides = { ...(site.stageOverrides || {}) };
      stageOverrides[idx] = { ...(stageOverrides[idx] || {}), paidAmount: 0, paidDate: null };
      await saveSiteOverride(siteId, { stageOverrides });
    }
    toast('Payment deleted.');
    if (onDone) onDone(); else rerender();
  });
}

function deleteCustomer(siteId) {

async function saveRecord(collection, rec) {
  if (AppState.dbReady && AppState.db) {
    try {
      await AppState.db.collection(collection).add(rec);
      return;
    } catch (e) {
      toast('Could not sync — saved locally only for this session.');
    }
  }
  rec.id = collection + '_' + Date.now() + '_' + Math.floor(Math.random() * 1e4);
  AppState[collection].push(rec);
  persistLocal();
}

// Payment-status buckets for the dashboard doughnut, counted at the invoice-row level (the same
// reconciled rows and status classification the Invoices page already uses, so the numbers here
// always agree with "All invoices / Fully paid / Partially paid / Unpaid" there). Optionally
// narrowed to one site and/or to invoices issued on or before a given month. Invoice rows that
// carry no invoice date at all are historical stage-schedule entries that predate date tracking —
// they're treated as already issued for every month, rather than dropped into an "Unknown" bucket.
function statusBucketsAsOf(ym, filterSiteId) {
  const buckets = { 'Fully Paid': 0, 'Partially Paid': 0, 'Unpaid': 0 };
  let rows = allInvoiceRows();
  if (filterSiteId) rows = rows.filter(r => r.site.id === filterSiteId);
  if (ym) rows = rows.filter(r => !r.invoiceDate || r.invoiceDate.slice(0, 7) <= ym);
  rows.forEach(r => { buckets[r.status] = (buckets[r.status] || 0) + 1; });
  return buckets;
}

function statusChartChipsHtml(buckets) {
  const dotColor = { 'Fully Paid': 'var(--success)', 'Partially Paid': 'var(--warning)', 'Unpaid': 'var(--danger)' };
  const total = Object.values(buckets).reduce((a, b) => a + b, 0);
  const chips = Object.entries(buckets)
    .map(([label, n]) => `<span class="status-chip"><span class="dot" style="background:${dotColor[label]};"></span>${label} <b>${n}</b></span>`).join('');
  return `<span class="status-chip"><span class="dot" style="background:var(--text-faint);"></span>Total invoices <b>${total}</b></span>${chips}`;
}

function drawStatusChart(buckets) {
  // The numeric chip breakdown is useful on its own even if the chart library itself can't load, so
  // it's set unconditionally rather than only after a successful Chart.js render.
  const chipsEl = document.getElementById('statusChartChips');
  if (chipsEl) chipsEl.innerHTML = statusChartChipsHtml(buckets);
  const canvas = document.getElementById('statusChart');
  if (!canvas || typeof Chart === 'undefined') { if (canvas) canvas.parentElement.innerHTML = '<div class="empty-state">Chart library unavailable.</div>'; return; }
  const styles = getComputedStyle(document.documentElement);
  if (_statusChart) _statusChart.destroy();
  _statusChart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: Object.keys(buckets),
      datasets: [{
        data: Object.values(buckets),
        backgroundColor: [styles.getPropertyValue('--success').trim(), styles.getPropertyValue('--warning').trim(), styles.getPropertyValue('--danger').trim()],
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '68%',
      plugins: { legend: { position: 'bottom', labels: { color: styles.getPropertyValue('--text-muted').trim(), boxWidth: 10, font: { size: 11 }, padding: 12 } } }
    }
  });
}

// Adds an alpha channel to a "#rrggbb" color (as read from a CSS custom property) for chart fills
// that need a lighter/translucent variant of a theme color without a second set of CSS variables.
function withAlpha(hex, alpha) {
  const h = (hex || '').trim().replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(full.slice(0, 2), 16), g = parseInt(full.slice(2, 4), 16), b = parseInt(full.slice(4, 6), 16);
  if ([r, g, b].some(Number.isNaN)) return hex;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Monthly "billed vs collected" figures across the whole portfolio, combined into the functional
// currency (MVR) — built from the same reconciled invoice/payment rows the Invoices and Payments
// pages use, so it reflects both historical (sales-agreement) stage data and live in-app records
// consistently.
function buildInvoicedPaidMonthly(months) {
  const idxOf = new Map(months.map((m, i) => [m, i]));
  const invoiced = months.map(() => 0);
  const paid = months.map(() => 0);
  allInvoiceRows().forEach(r => {
    if (!r.invoiceDate || !isIsoDate(r.invoiceDate)) return;
    const i = idxOf.get(r.invoiceDate.slice(0, 7));
    if (i == null) return;
    invoiced[i] = round2(invoiced[i] + toFunctional(r.amount || 0, r.site.currency));
  });
  allPaymentRows().forEach(r => {
    if (!r.date || !isIsoDate(r.date)) return;
    const i = idxOf.get(r.date.slice(0, 7));
    if (i == null) return;
    paid[i] = round2(paid[i] + toFunctional(r.amount || 0, r.site.currency));
  });
  return { invoiced, paid };
}

let _collectionProgressChart;
function drawCollectionProgressChart() {
  const canvas = document.getElementById('collectionProgressChart');

  const months = allMonthsRange().slice(-18);
  const { invoiced, paid } = buildInvoicedPaidMonthly(months);

  const styles = getComputedStyle(document.documentElement);

        { label: 'Collected (MVR)', data: paid, backgroundColor: withAlpha(accent, 0.45), borderRadius: 3, maxBarThickness: 16 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { grid: { display: false }, ticks: { color: styles.getPropertyValue('--text-muted').trim(), maxRotation: 0, autoSkip: true } },
        y: { grid: { color: styles.getPropertyValue('--border').trim() }, ticks: { color: styles.getPropertyValue('--text-muted').trim() } }

}

// A compact "collection progress" visual for the site's Balance card — an overall % collected
// progress bar plus a breakdown of how many payment-stage lines fall into each status bucket.
function siteProgressHtml(site, f) {
  const pct = f.contractValue > 0 ? Math.min(100, Math.max(0, round2(f.paidTotal / f.contractValue * 100))) : 0;
  const barColor = pct >= 100 ? 'var(--success)' : pct > 0 ? 'var(--accent)' : 'var(--border)';
  const stageRows = statementStageRows(site);
  const counts = { 'Fully Paid': 0, 'Partially Paid': 0, 'Unpaid': 0, 'Not invoiced': 0 };
  stageRows.forEach(r => { const s = stageRowStatus(r); if (counts[s] != null) counts[s]++; });
  const dotColor = { 'Fully Paid': 'var(--success)', 'Partially Paid': 'var(--warning)', 'Unpaid': 'var(--danger)', 'Not invoiced': 'var(--text-faint)' };
  const chips = Object.entries(counts).filter(([, n]) => n > 0)
    .map(([label, n]) => `<span class="status-chip"><span class="dot" style="background:${dotColor[label]};"></span>${label} <b>${n}</b></span>`).join('');
  return `
    <div style="margin-top:14px;">
      <div class="row between" style="margin-bottom:6px;">
        <span class="faint" style="font-size:11px;text-transform:uppercase;">Collection progress</span>
        <span style="font-size:12px;font-weight:600;">${fmtNum(pct)}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${barColor};"></div></div>
      ${stageRows.length ? `<div class="status-chip-row" style="margin-top:12px;">${chips}</div>` : `<div class="faint" style="font-size:12px;margin-top:10px;">No payment-stage schedule on file for this contract.</div>`}
    </div>`;
}

function collectionPill(c) {
  const cls = c === 'Overdue' ? 'danger' : c === 'Settled' ? 'success' : 'warning';
  return `<span class="pill pill-${cls}">${esc(c)}</span>`;
}

// Every invoice-like line across the whole portfolio: the sales-agreement payment-stage schedule
// (merged with any invoice/payment entered in-app against that stage) plus any live invoice that
// doesn't map to an existing stage. One row per invoice, always up to date with live activity.
function allInvoiceRows() {
  const rows = [];
  const today = new Date();
  allSites().forEach(baseSite => {
    const site = getSite(baseSite.id);
    statementStageRows(site).forEach(r => {
      if (r.invoiceAmount == null) return;
      const dueDate = r.dueDate || (r.invoiceDate ? addDaysIso(r.invoiceDate, 30) : null);
      const agingDays = dueDate ? daysBetween(new Date(dueDate + 'T00:00:00'), today) : null;
      const outstanding = r.due != null ? r.due : round2(r.invoiceAmount - (r.paidAmount || 0));
      const status = outstanding <= 0.01 ? 'Fully Paid' : ((r.paidAmount || 0) > 0 ? 'Partially Paid' : 'Unpaid');
      const collection = outstanding <= 0.01 ? 'Settled' : (agingDays != null && agingDays > 0 ? 'Overdue' : 'Due');
      rows.push({
        key: site.id + '_' + r.idx, idx: r.idx, site, stage: r.stage, invoiceNo: r.invoiceNo,
        invoiceDate: r.invoiceDate, dueDate, rawDueDate: r.dueDate || null, agingDays, amount: r.invoiceAmount, paid: r.paidAmount || 0,
        outstanding, status, collection, assumedPaid: !!r.assumedPaid, liveInvoiceId: r.liveInvoiceId || null,
      });
    });
  });
  return rows;
}

function resetInvoiceFilters() {
  ['fltInvClient', 'fltInvSite', 'fltInvMonth', 'fltInvStatus', 'fltInvCollection'].forEach(id => document.getElementById(id).value = '');
  setPage('invoices', 1);
  renderInvoicesTable();
