function filteredInvoiceRows() {
  const client = document.getElementById('fltInvClient').value;
  const siteId = document.getElementById('fltInvSite').value;
  const month = document.getElementById('fltInvMonth').value;
  const status = document.getElementById('fltInvStatus').value;
  const collection = document.getElementById('fltInvCollection').value;
  return allInvoiceRows().filter(r => {
    if (client && r.site.client !== client) return false;
    if (siteId && r.site.id !== siteId) return false;
    if (month && (!r.invoiceDate || r.invoiceDate.slice(0, 7) !== month)) return false;
    if (status && r.status !== status) return false;
    if (collection && r.collection !== collection) return false;
    return true;
  }).sort((a, b) => (b.invoiceDate || '').localeCompare(a.invoiceDate || ''));
}

function renderInvoicesTable() {
  const rows = filteredInvoiceRows();
  const bucket = { all: rows.length, fully: 0, partial: 0, unpaid: 0, overdue: 0 };
  let overdueTotalF = 0;
  rows.forEach(r => {
    if (r.status === 'Fully Paid') bucket.fully++;
    else if (r.status === 'Partially Paid') bucket.partial++;
    else bucket.unpaid++;
    if (r.collection === 'Overdue') { bucket.overdue++; overdueTotalF = round2(overdueTotalF + toFunctional(r.outstanding, r.site.currency)); }
  });
  document.getElementById('invSummary').innerHTML = `
    <div class="card kpi"><div class="label">All invoices</div><div class="value">${bucket.all}</div></div>
    <div class="card kpi"><div class="label">Fully paid</div><div class="value" style="color:var(--success)">${bucket.fully}</div></div>
    <div class="card kpi"><div class="label">Partially paid</div><div class="value" style="color:var(--warning)">${bucket.partial}</div></div>
    <div class="card kpi"><div class="label">Unpaid</div><div class="value" style="color:var(--danger)">${bucket.unpaid}</div></div>
    <div class="card kpi"><div class="label">Overdue</div><div class="value" style="color:var(--danger)">${bucket.overdue}</div>
      <div class="delta">${bucket.overdue ? `MVR ${fmtNum(overdueTotalF)}` : 'Nothing overdue'}</div></div>
  `;
  const state = paginateRows('invoices', rows);
  document.getElementById('invTbody').innerHTML = state.pageRows.length ? state.pageRows.map(r => `
    <tr class="row-link" onclick="navigate('site',{id:'${r.site.id}'})">
      <td class="mono">${esc(r.invoiceNo || '—')}</td>
      <td>${esc(r.site.client)}<div class="faint" style="font-size:11.5px;">${esc(r.site.site)}</div></td>
      <td class="faint">${esc(r.stage || '—')}</td>
      <td style="font-size:12px;">${fmtDate(r.invoiceDate)}${r.dueDate ? `<div class="faint">Due ${fmtDate(r.dueDate)}</div>` : ''}</td>
      <td>${r.agingDays != null ? agingPill(agingBucket(Math.max(r.agingDays, 0))) : '<span class="faint">—</span>'}</td>
      <td class="num">${fmtMoneyF(r.amount, r.site.currency)}</td>
      <td class="num">${fmtMoneyF(r.paid, r.site.currency)}${r.assumedPaid ? '<span class="faint">*</span>' : ''}</td>
      <td class="num" style="${r.outstanding > 1 ? 'font-weight:600;color:var(--warning)' : ''}">${fmtMoneyF(r.outstanding, r.site.currency)}</td>
      <td>${statusPill(r.status)}<div style="margin-top:3px;">${collectionPill(r.collection)}</div></td>
      <td class="no-print row" style="gap:6px;flex-wrap:nowrap;">${r.outstanding > 1 ? `<button class="btn btn-sm" onclick="event.stopPropagation();openPaymentModal('${r.site.id}', renderInvoicesTable, ${r.liveInvoiceId ? `'${r.liveInvoiceId}'` : 'null'})">Post payment</button>` : ''}<button class="btn btn-sm" onclick="event.stopPropagation();openEditDueDateModal('${r.site.id}','${r.idx}',${r.liveInvoiceId ? `'${r.liveInvoiceId}'` : 'null'},${r.rawDueDate ? `'${r.rawDueDate}'` : 'null'},renderInvoicesTable)">Due date</button><button class="btn btn-sm" onclick="event.stopPropagation();openEditInvoiceModal('${r.site.id}','${r.idx}',${r.liveInvoiceId ? `'${r.liveInvoiceId}'` : 'null'},renderInvoicesTable)" title="Edit invoice">Edit</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteInvoiceRow('${r.site.id}','${r.idx}',${r.liveInvoiceId ? `'${r.liveInvoiceId}'` : 'null'},renderInvoicesTable)" title="Delete invoice">Delete</button></td>
    </tr>`).join('') : `<tr><td colspan="10"><div class="empty-state">No invoices match these filters.</div></td></tr>`;
  document.getElementById('invPagination').innerHTML = paginationBarHtml('invoices', state, 'renderInvoicesTable');
}

async function exportInvoicesExcel() {
  if (typeof XLSX === 'undefined') { toast('Excel library unavailable right now.'); return; }
  const rows = filteredInvoiceRows();
  const header = ['Invoice no.', 'Client', 'Site', 'Currency (original)', 'Payment stage', 'Invoice date', 'Due date', 'Amount (MVR)', 'Paid (MVR)', 'Outstanding (MVR)', 'Status', 'Collection'];
  const aoa = [['Ascensor Pvt. Ltd — Invoices (shown in MVR)'], [`As at ${todayISO()}`], [], header,
    ...rows.map(r => [r.invoiceNo || '', r.site.client, r.site.site, r.site.currency, r.stage || '', r.invoiceDate || '', r.dueDate || '', toFunctional(r.amount, r.site.currency), toFunctional(r.paid, r.site.currency), toFunctional(r.outstanding, r.site.currency), r.status, r.collection])];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);

// One row per live in-app payment transaction, plus one row per historical stage payment recorded
// in the source sales-agreement schedule (never both for the same money — live payments are only
// ever posted against invoices issued in-app, so there's no overlap with the historical figures).
function allPaymentRows() {
  const rows = [];
  AppState.payments.forEach(p => {
    const site = getSite(p.siteId);
    if (!site) return;
    const inv = p.invoiceId ? AppState.invoices.find(i => i.id === p.invoiceId) : null;
    rows.push({ key: 'live_' + p.id, paymentId: p.id, idx: null, site, stage: inv ? inv.stage : null, invoiceNo: inv ? inv.invoiceNo : (p.reference || null), date: p.date, amount: p.amount });
  });
  allSites().forEach(baseSite => {
    const site = getSite(baseSite.id);
    const overrides = site.stageOverrides || {};
    (site.paymentStages || []).forEach((st, idx) => {
      const ov = overrides[idx];
      if (ov && ov.deleted) return;
      let paidAmount = st.paidAmount, paidDate = st.paidDate, stage = st.stage, invoiceNo = st.invoiceNo;
      if (ov) {
        if (ov.paidAmount !== undefined) paidAmount = ov.paidAmount;
        if (ov.paidDate !== undefined) paidDate = ov.paidDate;
        if (ov.stage !== undefined) stage = ov.stage;
        if (ov.invoiceNo !== undefined) invoiceNo = ov.invoiceNo;
      }
      if (!paidAmount || paidAmount <= 0) return;
      rows.push({ key: 'hist_' + site.id + '_' + idx, paymentId: null, idx, site, stage, invoiceNo, date: paidDate, amount: paidAmount });
    });
  });
  return rows;
}

function buildMonthlyMatrix(sites, months, groupBy) {
  const groups = new Map();
  sites.forEach(s => {
    const key = groupBy === 'client' ? s.client : s.id;
    const label = groupBy === 'client' ? s.client : `${s.client} — ${s.site}`;
    if (!groups.has(key)) groups.set(key, { label, values: months.map(() => 0) });
    const g = groups.get(key);
    // Figures are always shown in the functional currency (MVR) — a USD contract's monthly amount is
    // converted at the functional rate before it's added in, so the "USD" table below is really "USD
    // contracts, shown in MVR", not raw dollar figures.
    months.forEach((ym, idx) => { g.values[idx] = round2(g.values[idx] + toFunctional(monthlyAmountForSite(s, ym), s.currency)); });
  });
  return [...groups.values()].sort((a, b) => a.label.localeCompare(b.label));
}

function normalizeForDownload(buf) {
  if (buf instanceof ArrayBuffer || ArrayBuffer.isView(buf)) return buf;
  if (Array.isArray(buf)) return new Uint8Array(buf);
  return buf;
}

const DOWNLOAD_MIME = {
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  csv: 'text/csv',
  pdf: 'application/pdf',
  json: 'application/json',
};

function browserBlobDownload(filename, arrayBuffer) {
  const ext = (filename.split('.').pop() || '').toLowerCase();
  const blob = new Blob([arrayBuffer], { type: DOWNLOAD_MIME[ext] || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function offerDownload(filename, arrayBuffer) {
  arrayBuffer = normalizeForDownload(arrayBuffer);
  if (AppState.downloads) {
    try {
      await AppState.downloads.save({ filename, data: arrayBuffer });
      toast(`${filename} saved.`);
      return;
    } catch (e) {
      if (e && e.code === 'declined') return;
      if (!(e && e.code)) { /* fall through to browser download below */ }
      else { toast('Could not save the file — try again.'); return; }
    }
  }
  try {
    browserBlobDownload(filename, arrayBuffer);
    toast(`${filename} downloaded.`);
  } catch (e) {
    toast('Could not download the file in this browser.');
  }
}

function statementRowsForSite(site, asAt) {
  return siteMergedLedger(site).filter(r => !r.date || !isIsoDate(r.date) || r.date <= asAt);
}

// Payment-milestone rows (Invoice date/no/amount, Paid date/amount, Due amount, Payment stage) —
// built from the sales-agreement payment-terms schedule extracted from the source workbook,
// overlaid with any invoice issued in-app that matches the stage's invoice number, and with
// any manual corrections saved via the statement's Edit mode.
function normText(s) { return (s || '').toString().trim().toLowerCase(); }

// Payments posted in-app against a specific invoice — additive to whatever the historical
// sales-agreement row already recorded as paid (same "opening + extra" pattern as siteFinancials).
function paidAgainstInvoice(invoice, payments) {
  const linked = payments.filter(p => p.invoiceId === invoice.id);
  const amt = round2(linked.reduce((s, p) => s + (Number(p.amount) || 0), 0));
  const dates = linked.map(p => p.date).filter(Boolean).sort();
  return { amt, lastDate: dates.length ? dates[dates.length - 1] : null };
}

// Remaining balance on one specific invoice — its own amount minus whatever's already been posted
// against it in-app. Used to suggest a sensible "Amount received" when settling that invoice.
function invoiceOutstanding(invoice) {
  const { amt } = paidAgainstInvoice(invoice, sitePayments(invoice.siteId));
  return round2((Number(invoice.amount) || 0) - amt);
}

function statementStageRows(site) {
  const invoices = siteInvoices(site.id);
  const payments = sitePayments(site.id);
  const liveByNo = {}, liveByStage = {};
  invoices.forEach(i => {
    if (i.invoiceNo) liveByNo[normText(i.invoiceNo)] = i;
    if (i.stage) (liveByStage[normText(i.stage)] = liveByStage[normText(i.stage)] || []).push(i);
  });

  const base = (site.paymentStages && site.paymentStages.length) ? site.paymentStages : [];
  const overrides = site.stageOverrides || {};
  const maxOverrideIdx = Object.keys(overrides).reduce((m, k) => Math.max(m, parseInt(k, 10) || 0), -1);
  const count = Math.max(base.length, maxOverrideIdx + 1);
  // The reconciled contract-level balance (see siteFinancials) is the source of truth — it already
  // corrects known data-entry gaps in the source workbook. When a contract is fully paid overall but
  // an individual stage row never had its paid date/amount filled in in the sales-agreement table,
  // showing that row as still "due" would contradict the balance printed at the foot of the same
  // statement. In that case only, treat the missing stage payment as paid (flagged, never silent).
  const treatAsFullyPaid = siteFinancials(site).totalToCollect <= 1;
  let anyAssumed = false;
  const usedInvoiceIds = new Set();
  const rows = [];

  for (let idx = 0; idx < count; idx++) {
    const ov = overrides[idx];
    if (ov && ov.deleted) continue; // row removed via the statement editor
    const st = base[idx] || {};
    // Link a live invoice to this stage — an explicit "Payment stage" tag on the invoice wins,
    // falling back to matching the historical invoice number for older records.
    let linked = [];
    if (st.stage && liveByStage[normText(st.stage)]) linked = liveByStage[normText(st.stage)];
    else if (st.invoiceNo && liveByNo[normText(st.invoiceNo)]) linked = [liveByNo[normText(st.invoiceNo)]];
    linked.forEach(inv => usedInvoiceIds.add(inv.id));
    const primaryLive = linked[0];

    let row = {
      idx,
      stage: st.stage || null,
      invoiceNo: st.invoiceNo || (primaryLive ? primaryLive.invoiceNo || null : null),
      invoiceDate: primaryLive ? primaryLive.date : null,
      dueDate: st.dueDate || (primaryLive ? primaryLive.dueDate || null : null),
      invoiceAmount: st.invoiceAmount != null ? st.invoiceAmount : (primaryLive ? primaryLive.amount : null),
      paidDate: st.paidDate || null,
      paidAmount: st.paidAmount != null ? st.paidAmount : null,
      liveInvoiceId: primaryLive ? primaryLive.id : null,
    };
    if (ov) Object.entries(ov).forEach(([k, v]) => { if (k !== 'deleted' && v !== undefined) row[k] = v; });
    // A row added purely via the editor that was never filled in and never saved — skip the ghost line.
    if (idx >= base.length && !row.stage && !row.invoiceNo && row.invoiceAmount == null && row.paidAmount == null) continue;

    const hasExplicitOverride = ov && ov.paidAmount !== undefined;
    // Fold in any payment posted in-app against the linked invoice(s) for this stage.
    if (!hasExplicitOverride) {
      let livePaid = 0, livePaidDate = null;
      linked.forEach(inv => {
        const { amt, lastDate } = paidAgainstInvoice(inv, payments);
        livePaid = round2(livePaid + amt);
        if (lastDate && (!livePaidDate || lastDate > livePaidDate)) livePaidDate = lastDate;
      });
      if (livePaid > 0) {
        row.paidAmount = round2((row.paidAmount || 0) + livePaid);
        if (livePaidDate && (!row.paidDate || livePaidDate > row.paidDate)) row.paidDate = livePaidDate;
      }
    }
    if (!hasExplicitOverride && treatAsFullyPaid && row.invoiceAmount != null && row.paidAmount == null) {
      row.paidAmount = row.invoiceAmount;
      row.assumedPaid = true;
      anyAssumed = true;
    }
    const due = row.invoiceAmount != null ? round2(row.invoiceAmount - (row.paidAmount || 0)) : null;
    rows.push({ ...row, due });
  }

  // Any invoice issued in-app that wasn't tied to an existing stage row (a new stage tag, or none at
  // all) still needs to show up on the statement — as its own line, driven entirely by live records.
  invoices.forEach(inv => {
    if (usedInvoiceIds.has(inv.id)) return;
    const { amt: paidAmount, lastDate: paidDate } = paidAgainstInvoice(inv, payments);
    rows.push({
      idx: 'live_' + inv.id, derived: true, liveInvoiceId: inv.id,
      stage: inv.stage || 'Additional invoice',
      invoiceNo: inv.invoiceNo || null, invoiceDate: inv.date, dueDate: inv.dueDate || null, invoiceAmount: inv.amount,
      paidDate, paidAmount: paidAmount || null, due: round2((inv.amount || 0) - paidAmount),
    });
  });

  rows.anyAssumed = anyAssumed;
  return rows;
}

async function saveStatementEdits(siteId, clientName, asAt) {
  const site = getSite(siteId);
  const originalCount = (site.paymentStages || []).length;
  const stageOverrides = [...document.querySelectorAll('.stage-input[data-idx]')].reduce((acc, el) => {
    const idx = el.dataset.idx, field = el.dataset.field;
    acc[idx] = acc[idx] || {};
    acc[idx][field] = el.type === 'number' ? (el.value === '' ? null : parseFloat(el.value)) : (el.value || null);
    return acc;
  }, {});
  // Any originally-sourced stage row no longer present in the DOM was removed via the "✕" button —
  // record that explicitly, since an override map can only add/change fields, not omit a row by itself.
  const presentIdxs = new Set([...document.querySelectorAll('tr[data-row-idx]')].map(tr => tr.dataset.rowIdx));
  for (let i = 0; i < originalCount; i++) {
    if (!presentIdxs.has(String(i))) stageOverrides[i] = { deleted: true };
  }
  const notesEl = document.getElementById('stNotesInput');
  await saveSiteOverride(siteId, { stageOverrides, statementNotes: notesEl ? notesEl.value.trim() : '' });
  statementEditMode = false;
  toast('Statement updated.');
  const updatedSites = sitesForClient(clientName).filter(s => s.id === siteId);
  drawStatementPreview(updatedSites, clientName, asAt);
}

// Append a blank, editable payment-stage row to the statement being edited (client-side only until Save).
function addStatementStageRow(siteId) {
  const table = document.querySelector(`table[data-site-id="${siteId}"]`);
  if (!table) return;
  const tbody = table.querySelector('tbody');
  const existingIdxs = [...tbody.querySelectorAll('tr[data-row-idx]')].map(tr => parseInt(tr.dataset.rowIdx, 10));
  const nextIdx = existingIdxs.length ? Math.max(...existingIdxs) + 1 : 0;
  const tr = document.createElement('tr');
  tr.dataset.rowIdx = nextIdx;
  tr.innerHTML = `
    <td><input class="stage-input text" type="text" data-idx="${nextIdx}" data-field="stage" placeholder="Payment stage"></td>
    <td><input class="stage-input" type="date" data-idx="${nextIdx}" data-field="invoiceDate"></td>

    <td><input class="stage-input" type="date" data-idx="${nextIdx}" data-field="paidDate"></td>
    <td><input class="stage-input" type="number" step="0.01" data-idx="${nextIdx}" data-field="paidAmount"></td>

}

// Per-row payment status for a statement stage line — mirrors the Fully Paid / Partially Paid /
// Unpaid convention used on the Invoices page, so a customer statement reads the same way.
function stageRowStatus(r) {
  if (r.invoiceAmount == null) return 'Not invoiced';
  const due = r.due != null ? r.due : round2(r.invoiceAmount - (r.paidAmount || 0));
  if (due <= 0.01) return 'Fully Paid';
  if ((r.paidAmount || 0) > 0) return 'Partially Paid';
  return 'Unpaid';
}
function stageStatusPill(r) {
  const status = stageRowStatus(r);
  if (status === 'Not invoiced') return `<span class="pill pill-neutral">Not invoiced</span>`;
  return statusPill(status);
}

function statementSheetData(site, asAt) {
  const f = siteFinancials(site);
  const stageRows = statementStageRows(site);
  const hasStages = stageRows.length > 0;
  const aoa = [
    ['Ascensor Pvt. Ltd'], ['Customer Account Statement'], [`As at ${asAt}`], [],
    ['Client', site.client], ['Site', site.site], ['Lift reference', site.liftRefNo || ''],
    ['Lift model', site.liftModel || ''], ['Brand', site.liftBrand || ''], ['No. of stops', site.liftStops || ''],
    ['Speed', site.liftSpeed || ''], ['Weight / load', site.liftLoad || ''],
    ['Currency (original)', site.currency], ['All amounts below shown in', 'MVR'],
    ['Contract value', toFunctional(f.contractValue, site.currency)], ['Total contract value to be collected', toFunctional(f.totalToCollect, site.currency)],
    ['Paid amount', toFunctional(f.paidTotal, site.currency)], ['Outstanding amount', toFunctional(f.outstanding, site.currency)], [],
  ];
  if (hasStages) {
    const dueSubtotal = round2(stageRows.reduce((s, r) => s + toFunctional(r.due || 0, site.currency), 0));
    aoa.push(['Payment stage', 'Invoice date', 'Invoice no', 'Invoice amount (MVR)', 'Paid date', 'Paid amount (MVR)', 'Due amount (MVR)', 'Status']);
    stageRows.forEach(r => aoa.push([r.stage || '', r.invoiceDate || '', r.invoiceNo || '', r.invoiceAmount != null ? toFunctional(r.invoiceAmount, site.currency) : '', r.paidDate || '', r.paidAmount != null ? toFunctional(r.paidAmount, site.currency) : '', r.due != null ? toFunctional(r.due, site.currency) : '', stageRowStatus(r)]));
    aoa.push(['', '', '', '', '', 'Subtotal (Due amount)', dueSubtotal, '']);
  } else {
    aoa.push(['Date', 'Type', 'Reference', 'Amount (MVR)']);
    statementRowsForSite(site, asAt).forEach(r => aoa.push([r.date || '', r.type, r.invoiceNo, toFunctional(r.amount, site.currency)]));
  }
  if (site.statementNotes) { aoa.push([]); aoa.push(['Note', site.statementNotes]); }
  return aoa;
}

function safeSheetName(raw, used) {
  let name = String(raw || 'Sheet').replace(/[\\/*?:[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28) || 'Sheet';
  let candidate = name, n = 2;
  while (used.has(candidate.toLowerCase())) { candidate = `${name} (${n++})`.slice(0, 31); }
  used.add(candidate.toLowerCase());
  return candidate;
}

async function exportSingleStatementExcel() {
  if (typeof XLSX === 'undefined') { toast('Excel library unavailable right now.'); return; }
  const clientName = document.getElementById('stClient').value;
  const selectedSiteId = document.getElementById('stSite').value;
  const asAt = document.getElementById('stAsAt').value || todayISO();
  if (!clientName) { toast('Choose a client first.'); return; }
  let sites = sitesForClient(clientName);
  if (selectedSiteId) sites = sites.filter(s => s.id === selectedSiteId);
  const wb = XLSX.utils.book_new();
  const used = new Set();
  sites.forEach((site, idx) => {
    const ws = XLSX.utils.aoa_to_sheet(statementSheetData(site, asAt));
    ws['!cols'] = [{ wch: 30 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(site.site || `Site ${idx + 1}`, used));
  });
  const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  await offerDownload(`Statement-${clientName.replace(/[^a-z0-9]+/gi, '-')}-${asAt}.xlsx`, buf);
}

async function exportBulkStatementsExcel() {
  if (typeof XLSX === 'undefined') { toast('Excel library unavailable right now.'); return; }

      const ws = XLSX.utils.aoa_to_sheet(statementSheetData(site, asAt));
      ws['!cols'] = [{ wch: 30 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, ws, safeSheetName(`${clientName} ${site.site}`, used));
    });
  });
  const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  await offerDownload(`Statements-Bulk-${asAt}.xlsx`, buf);
}

function outstandingRows() {
  const currency = document.getElementById('oCurrency').value;
  const min = parseFloat(document.getElementById('oMin').value) || 0;
  const projStatus = document.getElementById('oProjStatus').value;
  const today = new Date();
  let rows = allSites().map(s => {
    const f = siteFinancials(s);
    const days = f.lastActivity && isIsoDate(f.lastActivity) ? daysBetween(new Date(f.lastActivity), today) : null;
    return { site: s, f, aging: agingBucket(days) };
  }).filter(r => r.f.outstanding >= min);
  if (currency) rows = rows.filter(r => r.site.currency === currency);
  if (projStatus) rows = rows.filter(r => r.site.projectStatus === projStatus);
  return rows.sort((a, b) => b.f.outstanding - a.f.outstanding);
}

function groupOutstandingByClient(rows) {
  const map = new Map();
  rows.forEach(r => {
    const key = r.site.client + '|' + r.site.currency;
    if (!map.has(key)) map.set(key, { client: r.site.client, currency: r.site.currency, outstanding: 0, contract: 0, paid: 0, sites: 0, worstAging: r.aging });
    const g = map.get(key);
    g.outstanding = round2(g.outstanding + r.f.outstanding);
    g.contract = round2(g.contract + r.f.invoicedTotal);
    g.paid = round2(g.paid + r.f.paidTotal);
    g.sites += 1;
    const order = ['Current', '30–59 days', '60–89 days', '90+ days'];
    if (order.indexOf(r.aging) > order.indexOf(g.worstAging)) g.worstAging = r.aging;
  });
  return [...map.values()].sort((a, b) => b.outstanding - a.outstanding);
}

function agingPill(a) {
  const cls = a === '90+ days' ? 'danger' : a === '60–89 days' ? 'warning' : a === '30–59 days' ? 'warning' : 'success';
  return `<span class="pill pill-${cls}">${a}</span>`;
}

async function updateCustomSite(id, patch) {
  const idx = AppState.customSites.findIndex(s => s.id === id);
  if (idx !== -1) AppState.customSites[idx] = { ...AppState.customSites[idx], ...patch };
  if (AppState.dbReady && AppState.db) {
    try { await AppState.db.collection('customSites').doc(id).set(patch, { merge: true }); return; }
    catch (e) { toast('Could not sync — saved locally only for this session.'); }
  }
  persistLocal();
}

async function updateRecord(collection, id, patch) {
  const idx = AppState[collection].findIndex(r => r.id === id);
  if (idx !== -1) AppState[collection][idx] = { ...AppState[collection][idx], ...patch };
  if (AppState.dbReady && AppState.db) {
    try { await AppState.db.collection(collection).doc(id).set(patch, { merge: true }); return; }
    catch (e) { toast('Could not sync — saved locally only for this session.'); }
  }
  persistLocal();
}

async function deleteRecord(collection, id) {
  AppState[collection] = AppState[collection].filter(r => r.id !== id);
  if (AppState.dbReady && AppState.db) {
    try { await AppState.db.collection(collection).doc(id).delete(); return; }
    catch (e) { toast('Could not sync — saved locally only for this session.'); }
  }
  persistLocal();
}

async function replaceCollectionDocs(name, records) {
  if (AppState.dbReady && AppState.db) {
    const coll = AppState.db.collection(name);
    try {
      const snap = await coll.get();
      await Promise.all(snap.docs.map(d => coll.doc(d.id).delete()));
    } catch (e) { /* best-effort clear */ }
    // Clear the local in-memory cache immediately — the live onSnapshot listener will confirm this
    // moments later, but anything that runs synchronously right after this call (e.g. an Excel import
    // that follows a "Replace all data" wipe) must see an empty collection right away. Without this,
    // stale local records could still match by id/name during that import and get "updated" against
    // documents that were just deleted, silently discarding the new data.
    AppState[name] = [];
    await Promise.all(records.map(r => {
      const { id, ...rest } = r || {};
      return id ? coll.doc(id).set(rest) : coll.add(rest);
    }));
  } else {
    AppState[name] = records;
    persistLocal();
  }
}

async function replaceOverridesDocs(overridesObj) {
  if (AppState.dbReady && AppState.db) {
    const coll = AppState.db.collection('siteOverrides');
    try {
      const snap = await coll.get();
      await Promise.all(snap.docs.map(d => coll.doc(d.id).delete()));
    } catch (e) { /* best-effort clear */ }
    AppState.siteOverrides = {};
    await Promise.all(Object.entries(overridesObj || {}).map(([siteId, patch]) => coll.doc(siteId).set(patch || {})));
  } else {
    AppState.siteOverrides = overridesObj || {};
    persistLocal();
  }
}

function csvEscape(v) {
  if (v == null) return '';

  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';

/* --------------------------- Import from Excel ---------------------------- */

function normalizeSheetName(s) { return (s || '').toString().trim().toLowerCase(); }
function findSheet(wb, wantedName) {
  const target = normalizeSheetName(wantedName);
  const match = wb.SheetNames.find(n => normalizeSheetName(n) === target);
  return match ? wb.Sheets[match] : null;
}
function excelValueToIso(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'string') {
    if (isIsoDate(v)) return v.slice(0, 10);
    const d = new Date(v);
    return isNaN(d) ? null : d.toISOString().slice(0, 10);
  }
  if (typeof v === 'number' && typeof XLSX !== 'undefined' && XLSX.SSF && XLSX.SSF.parse_date_code) {
    const d = XLSX.SSF.parse_date_code(v);
    if (d) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
  }
  return null;
}
function numOrNull(v) {
  if (v === '' || v == null) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function strOrNull(v) { const s = (v == null ? '' : String(v)).trim(); return s || null; }
function getCol(row, ...names) {
  for (const n of names) {
    for (const k of Object.keys(row)) {
      if (normalizeSheetName(k) === normalizeSheetName(n)) return row[k];
    }
  }
  return undefined;
}

function readWorkbookFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try { resolve(XLSX.read(e.target.result, { type: 'array', cellDates: true })); }
      catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('read error'));
    reader.readAsArrayBuffer(file);
  });
}

async function importClientsRows(rows, mode, summary) {
  for (const row of rows) {
    const client = strOrNull(getCol(row, 'Client'));
    const site = strOrNull(getCol(row, 'Site'));
    if (!client || !site) { summary.skipped.push({ sheet: 'Clients', reason: 'Missing Client or Site' }); continue; }
    const seedMatch = SEED.sites.find(x => normText(x.client) === normText(client) && normText(x.site) === normText(site));
    if (seedMatch) { summary.skipped.push({ sheet: 'Clients', reason: `"${client} — ${site}" is one of the original workbook contracts and isn't changed by import` }); continue; }
    const existing = AppState.customSites.find(x => normText(x.client) === normText(client) && normText(x.site) === normText(site));
    if (existing && mode === 'addonly') { summary.skipped.push({ sheet: 'Clients', reason: `"${client} — ${site}" already exists (Add new records only)` }); continue; }

    const pct = numOrNull(getCol(row, 'GST %', 'GST Pct')) || 0;
    const incl = numOrNull(getCol(row, 'Contract Value (incl. GST)', 'Contract Value'));
    const exLegacy = numOrNull(getCol(row, 'Contract Value (excl. GST)', 'Contract Value Excl GST'));
    let ex, gst, total;
    if (incl != null) { total = incl; ex = round2(total / (1 + pct / 100)); gst = round2(total - ex); }
    else if (exLegacy != null) { ex = exLegacy; gst = round2(ex * pct / 100); total = round2(ex + gst); }
    else { ex = null; gst = null; total = null; }
    const patch = {
      client, site, rawDetails: `${client} / ${site}`,
      currency: strOrNull(getCol(row, 'Currency')) || 'MVR',
      gstRatePct: pct, contractExclGst: ex, gstAmount: gst, contractInclGst: total,
      contractSignDate: excelValueToIso(getCol(row, 'Contract Signed Date', 'Contract Sign Date')),
      handoverDate: excelValueToIso(getCol(row, 'Handover Date')),
      projectStatus: strOrNull(getCol(row, 'Project Status')) || 'Ongoing',
      nextPaymentTerm: strOrNull(getCol(row, 'Next Payment Term')),
      liftRefNo: strOrNull(getCol(row, 'Lift Reference No.', 'Lift Reference No')),
      liftBrand: strOrNull(getCol(row, 'Lift Brand')),
      liftModel: strOrNull(getCol(row, 'Lift Model')),
      liftStops: strOrNull(getCol(row, 'No. of Stops', 'Stops')),
      liftSpeed: strOrNull(getCol(row, 'Speed')),
      liftLoad: strOrNull(getCol(row, 'Weight / Load', 'Weight/Load')),
      mobile: strOrNull(getCol(row, 'Mobile Number', 'Mobile', 'Phone')),
      email: strOrNull(getCol(row, 'Email Address', 'Email')),
    };

    if (existing) {
      const cleaned = Object.fromEntries(Object.entries(patch).filter(([, v]) => v != null));
      await updateCustomSite(existing.id, cleaned);
      summary.updated.clients++;
    } else {
      const no = 1 + Math.max(0, ...allSites().map(s => s.no || 0));
      const rec = {
        id: 'imp' + Date.now() + '_' + Math.floor(Math.random() * 1e4), no,
        openingPaid: 0, openingOutstandingUsd: null, openingOutstandingMvr: null, dueUsd: null, dueMvr: null,
        paymentStatus: total > 0 ? 'Unpaid' : 'Unknown', paymentStatusRaw: '', projectStatusRaw: '',
        remarks: [], myRemarks: null, monthly: {}, ledger: [], paymentStages: [], custom: true,
        createdAt: new Date().toISOString(),
        ...patch,
      };
      await saveNewSite(rec);
      summary.added.clients++;
    }
  }
}

async function importInvoicesRows(rows, mode, summary) {
  for (const row of rows) {
    const client = strOrNull(getCol(row, 'Client'));
    const siteName = strOrNull(getCol(row, 'Site'));
    if (!client || !siteName) { summary.skipped.push({ sheet: 'Invoices', reason: 'Missing Client or Site' }); continue; }
    const site = findSiteByClientSite(client, siteName);
    if (!site) { summary.skipped.push({ sheet: 'Invoices', reason: `No site found matching "${client} — ${siteName}"` }); continue; }
    const pct = numOrNull(getCol(row, 'GST %')) || 0;
    const incl = numOrNull(getCol(row, 'Amount (incl. GST)', 'Amount', 'Amount Incl GST'));
    const exLegacy = numOrNull(getCol(row, 'Amount (excl. GST)', 'Amount Excl GST'));
    let ex, gst, total;
    if (incl != null) { total = incl; ex = round2(total / (1 + pct / 100)); gst = round2(total - ex); }
    else if (exLegacy != null) { ex = exLegacy; gst = round2(ex * pct / 100); total = round2(ex + gst); }
    else { summary.skipped.push({ sheet: 'Invoices', reason: `Missing or invalid amount for "${client} — ${siteName}"` }); continue; }
    const id = strOrNull(getCol(row, 'ID'));
    const invoiceNo = strOrNull(getCol(row, 'Invoice No.', 'Invoice No', 'Invoice Number'));
    const rec = {
      siteId: site.id,
      date: excelValueToIso(getCol(row, 'Invoice Date')) || todayISO(),
      invoiceNo: invoiceNo || '',
      dueDate: excelValueToIso(getCol(row, 'Due Date')) || null,
      amount: total, amountExGst: ex, gstAmount: gst, gstPct: pct,
      stage: strOrNull(getCol(row, 'Payment Stage', 'Stage')),
      currency: site.currency,
      notes: strOrNull(getCol(row, 'Notes')) || '',
      createdAt: new Date().toISOString(),
    };

    let existing = null;
    if (id) existing = AppState.invoices.find(x => x.id === id);
    if (!existing && invoiceNo) existing = AppState.invoices.find(x => x.siteId === site.id && normText(x.invoiceNo) === normText(invoiceNo));

    if (existing) {
      if (mode === 'addonly') { summary.skipped.push({ sheet: 'Invoices', reason: `Invoice ${invoiceNo || id} already exists (Add new records only)` }); continue; }
      await updateRecord('invoices', existing.id, rec);
      summary.updated.invoices++;
    } else {
      await saveRecord('invoices', rec);
      summary.added.invoices++;
    }
  }
}

async function importPaymentsRows(rows, mode, summary) {
  for (const row of rows) {
    const client = strOrNull(getCol(row, 'Client'));
    const siteName = strOrNull(getCol(row, 'Site'));
    if (!client || !siteName) { summary.skipped.push({ sheet: 'Payments', reason: 'Missing Client or Site' }); continue; }
    const site = findSiteByClientSite(client, siteName);
    if (!site) { summary.skipped.push({ sheet: 'Payments', reason: `No site found matching "${client} — ${siteName}"` }); continue; }
    const amount = numOrNull(getCol(row, 'Amount Paid', 'Amount'));
    if (amount == null) { summary.skipped.push({ sheet: 'Payments', reason: `Missing or invalid amount for "${client} — ${siteName}"` }); continue; }
    const id = strOrNull(getCol(row, 'ID'));
    const invoiceNoRef = strOrNull(getCol(row, 'Invoice No.', 'Invoice No'));
    let invoiceId = null;
    if (invoiceNoRef) {
      const inv = AppState.invoices.find(x => x.siteId === site.id && normText(x.invoiceNo) === normText(invoiceNoRef));
      if (inv) invoiceId = inv.id;
    }
    const rec = {
      siteId: site.id,
      date: excelValueToIso(getCol(row, 'Date Paid', 'Date')) || todayISO(),
      amount, currency: site.currency,
      invoiceId,
      reference: strOrNull(getCol(row, 'Reference')) || '',
      notes: strOrNull(getCol(row, 'Notes')) || '',
      createdAt: new Date().toISOString(),
    };

    const existing = id ? AppState.payments.find(x => x.id === id) : null;
    if (existing) {
      if (mode === 'addonly') { summary.skipped.push({ sheet: 'Payments', reason: `Payment ${id} already exists (Add new records only)` }); continue; }
      await updateRecord('payments', existing.id, rec);
      summary.updated.payments++;
    } else {
      await saveRecord('payments', rec);
      summary.added.payments++;
    }
  }
}

async function runExcelImport(wb, mode) {
  const summary = { added: { clients: 0, invoices: 0, payments: 0 }, updated: { clients: 0, invoices: 0, payments: 0 }, skipped: [] };
  const clientsWs = findSheet(wb, 'Clients');
  const invoicesWs = findSheet(wb, 'Invoices');
  const paymentsWs = findSheet(wb, 'Payments');
  if (!clientsWs && !invoicesWs && !paymentsWs) {
    toast('No recognised sheets found — expecting tabs named "Clients", "Invoices" and/or "Payments".');
    return null;
  }
  if (mode === 'replace') await performReplace({ customSites: [], invoices: [], payments: [] });
  if (clientsWs) await importClientsRows(XLSX.utils.sheet_to_json(clientsWs, { defval: '' }), mode, summary);
  if (invoicesWs) await importInvoicesRows(XLSX.utils.sheet_to_json(invoicesWs, { defval: '' }), mode, summary);
  if (paymentsWs) await importPaymentsRows(XLSX.utils.sheet_to_json(paymentsWs, { defval: '' }), mode, summary);
  return summary;
}

async function runImportFlow(file, mode) {
  try {
    const wb = await readWorkbookFile(file);
    const summary = await runExcelImport(wb, mode);
    if (summary) openImportSummaryModal(summary);
    rerender();
  } catch (e) {
    toast('Could not read that Excel file.');
  }
}

function handleImportFileInput(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') { toast('Excel library unavailable right now.'); input.value = ''; return; }
  const modeInput = document.querySelector('input[name="importMode"]:checked');
  const mode = modeInput ? modeInput.value : 'update';
  if (mode === 'replace') { openConfirmReplaceImportModal(file); return; }
  runImportFlow(file, mode);
  input.value = '';
}

function openConfirmReplaceImportModal(file) {
  const body = `<p class="search-note" style="color:var(--danger);">"Replace all data" first deletes every added customer, invoice and payment currently in this app, then imports the file. This cannot be undone.</p>`;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="confirmReplaceImportBtn">Replace &amp; import</button>`;
  openModal('Replace all data with this file?', body, foot);
  document.getElementById('confirmReplaceImportBtn').addEventListener('click', async () => {
    closeModal();
    await runImportFlow(file, 'replace');
    const input = document.getElementById('importFileInput');
    if (input) input.value = '';
  });
}

function openImportSummaryModal(summary) {
  const addedTotal = summary.added.clients + summary.added.invoices + summary.added.payments;
  const updatedTotal = summary.updated.clients + summary.updated.invoices + summary.updated.payments;
  const body = `
    <div class="stat-line"><span class="k">Added</span><span class="v">${addedTotal}</span></div>
    <div class="stat-line"><span class="k">Updated</span><span class="v">${updatedTotal}</span></div>
    <div class="stat-line"><span class="k">Skipped</span><span class="v">${summary.skipped.length}</span></div>

      ${summary.skipped.slice(0, 50).map(s => `<div style="padding:4px 0;border-bottom:1px solid var(--border);">${esc(s.sheet)}: ${esc(s.reason)}</div>`).join('')}
      ${summary.skipped.length > 50 ? `<div class="faint" style="padding-top:6px;">…and ${summary.skipped.length - 50} more</div>` : ''}

  const foot = `<button class="btn btn-primary" onclick="closeModal()">Done</button>`;
  openModal('Import complete', body, foot);
}

<script>
/* Lumen theme behaviour for Ascensor Collections: motion, phone menu, workspace
   switcher, the theme choice shared with AMC Receivables, and the shared account.
   It does not change how contracts, invoices, payments or statements are stored or calculated. */
(function () {
  'use strict';
  var WS_CURRENT = 'collections';
  /* Workspace switcher: the brand block opens a small menu to move between the two sites. */
  var WS = [
    { id: 'amc', name: 'AMC Receivables', sub: 'Lift maintenance contracts', href: 'index.html', mark: 'AMC' },
    { id: 'collections', name: 'Ascensor Collections', sub: 'Lift project contracts', href: 'collections.html', mark: 'AC' }
  ];
  var wsPop = null, wsAnchor = null;
  function wsClose() { if (wsPop) { wsPop.remove(); wsPop = null; if (wsAnchor) wsAnchor.setAttribute('aria-expanded', 'false'); } }
  function wsOpen(anchor, rectEl) {
    if (wsPop) { wsClose(); return; }
    wsAnchor = anchor;
    var pop = document.createElement('div');
    pop.className = 'ws-pop'; pop.setAttribute('role', 'menu'); pop.setAttribute('aria-label', 'Switch workspace');
    var cap = document.createElement('div'); cap.className = 'ws-cap'; cap.textContent = 'Switch workspace'; pop.appendChild(cap);
    WS.forEach(function (w) {
      var cur = w.id === WS_CURRENT, el = document.createElement(cur ? 'div' : 'a');
      el.className = 'ws-item'; el.setAttribute('role', 'menuitem');
      if (cur) el.setAttribute('aria-current', 'true'); else el.href = w.href;
      var m = document.createElement('span'); m.className = 'ws-mark'; m.textContent = w.mark;
      var t = document.createElement('span'), b = document.createElement('b'), s = document.createElement('small');
      b.textContent = w.name; s.textContent = w.sub; t.appendChild(b); t.appendChild(s);
      el.appendChild(m); el.appendChild(t);
      if (cur) { var e = document.createElement('em'); e.textContent = 'Open'; el.appendChild(e); }
      pop.appendChild(el);
    });
    document.body.appendChild(pop);
    var r = (rectEl || anchor).getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 276)) + 'px';
    pop.style.top = Math.min(r.bottom + 8, window.innerHeight - pop.offsetHeight - 8) + 'px';
    wsPop = pop; anchor.setAttribute('aria-expanded', 'true');
    var link = pop.querySelector('a'); if (link) link.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) { if (wsPop && !wsPop.contains(e.target) && !(wsAnchor && wsAnchor.contains(e.target)) && !e.target.closest('[data-ws]')) wsClose(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && wsPop) { wsClose(); if (wsAnchor) wsAnchor.focus(); } });
  window.addEventListener('resize', wsClose);
  var $ = function (id) { return document.getElementById(id); };
  var side = $('sideNav'), content = $('content'), scrim = $('railScrim'), menuBtn = $('menuBtn');
  $('wsBtn').addEventListener('click', function () { wsOpen($('wsBtn')); });

  /* Phone menu */
  function drawer(open) { side.classList.toggle('open', open); scrim.hidden = !open; menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function () { drawer(!side.classList.contains('open')); });
  scrim.addEventListener('click', function () { drawer(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') drawer(false); });

  /* Menu pill and page-change motion */
  var order = Object.keys(ROUTES), lastRoute = null, enterT = 0, settleT = 0;
  function place(still) {
    var on = side.querySelector('.nav-item.active');
    if (!on) { side.classList.remove('lumen-ind'); return; }
    if (still) side.classList.add('lumen-still');
    side.style.setProperty('--ind-t', on.offsetTop + 'px');
    side.style.setProperty('--ind-l', on.offsetLeft + 'px');
    side.style.setProperty('--ind-r', (side.clientWidth - on.offsetLeft - on.offsetWidth) + 'px');
    side.style.setProperty('--ind-b', (side.clientHeight - on.offsetTop - on.offsetHeight) + 'px');
    side.classList.add('lumen-ind');
    if (still) requestAnimationFrame(function () { requestAnimationFrame(function () { side.classList.remove('lumen-still'); }); });
  }
  function routeChanged() {
    var route = parseHash().route;
    drawer(false); wsClose();
    if (route === lastRoute) { place(true); return; }
    var back = lastRoute !== null && order.indexOf(route) < order.indexOf(lastRoute), first = lastRoute === null;
    lastRoute = route;
    side.classList.toggle('lumen-back', back);
    place(first);
    clearTimeout(settleT); settleT = setTimeout(function () { place(true); }, 700);
    content.classList.remove('lumen-enter', 'lumen-back'); void content.offsetWidth;
    content.classList.add('lumen-enter'); content.classList.toggle('lumen-back', back);
    clearTimeout(enterT); enterT = setTimeout(function () { content.classList.remove('lumen-enter', 'lumen-back'); }, 1500);
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', routeChanged);
  window.addEventListener('resize', function () { place(true); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { place(true); });
  routeChanged();

  /* Light / dark choice is shared with AMC Receivables */
  try {
    var saved = localStorage.getItem('amc_theme_v1');
    if (saved === 'light' || saved === 'dark') { themeOverride = saved; applyTheme(); rerender(); place(true); }
  } catch (e) {}
  $('themeToggleBtn').addEventListener('click', function () { try { localStorage.setItem('amc_theme_v1', themeOverride); } catch (e) {} });

  /* Shared account: the same sign-in as AMC Receivables (checked in the script above). */
  function gate(title, text, label) {
    $('gateTitle').textContent = title; $('gateText').textContent = text; $('gateBtn').textContent = label || 'Go to sign-in';
    $('lumenGate').hidden = false; document.body.classList.add('lumen-locked');
  }
  var LC = window.LumenCloud;

  /* Admins load the client list once from a private file; it is then shared with the signed-in team. */
  function seedCardHtml() {
    var n = SEED.sites.length;
    var status = n ? '<b>' + n + '</b> contracts are in the shared client list.' : 'The shared client list is empty.';
    var action = LC.isAdmin
      ? '<label class="btn btn-primary" for="seedFileInput" style="cursor:pointer;">' + (n ? 'Replace client list' : 'Import client list') + '</label><input type="file" id="seedFileInput" accept=".json,application/json" hidden>'
      : '<span class="faint" style="font-size:12.5px;">Only an admin can import or replace it.</span>';
    return '<div class="card card-pad data-section" id="seedCard"><div class="data-section-head"><div><h2>Shared client list</h2><div class="faint" style="font-size:12.5px;margin-top:3px;">' + status + ' It is stored behind the team sign-in, not inside this page.</div></div><div class="hint">Use the private file <b>ascensor-client-list.json</b>. Keep that file off GitHub.</div></div>' + action + '</div>';
  }
  function wireSeedCard() {
    var input = $('seedFileInput'); if (!input) return;
    input.addEventListener('change', function () {
      var file = input.files && input.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data = null;
        try { data = JSON.parse(reader.result); } catch (e) {}
        var ok = data && data.type === 'ascensor-collections-client-list' && Array.isArray(data.sites) && data.sites.length && data.sites.every(function (s) { return s && s.id && s.client && s.site; });
        if (!ok) { toast('That is not a client list file. Choose ascensor-client-list.json.'); input.value = ''; return; }
        openModal('Import client list?', '<p style="margin:0;">This loads <b>' + data.sites.length + '</b> contracts into the shared client list for everyone who is signed in. It replaces the current list of ' + SEED.sites.length + '. Invoices, payments and edits made in this page are kept.</p>',
          '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="seedGoBtn">Import ' + data.sites.length + ' contracts</button>');
        $('seedGoBtn').addEventListener('click', async function () {
          var b = $('seedGoBtn'); b.disabled = true; b.textContent = 'Importing…';
          try { var n = await LC.importSeed(data); closeModal(); toast(n + ' contracts imported to the shared client list.'); rerender(); }
          catch (e) { closeModal(); toast('Import failed: ' + ((e && e.message) || 'check your connection and admin access') + '.'); }
        });
      };
      reader.readAsText(file);
    });
  }
  LC.ready.then(function (s) {
    if (s.mode === 'local') return;
    if (s.mode !== 'cloud') {
      if (s.reason === 'not-ready') gate('Account not ready yet', 'Your account still needs approval or profile details. Finish that in AMC Receivables first.', 'Open AMC Receivables');
      else if (s.reason === 'error') gate('Could not check your sign-in', 'Check your connection and reload this page. If it keeps happening, sign in again in AMC Receivables.', 'Open AMC Receivables');
      else if (s.reason === 'no-profile') gate('Sign in to continue', 'Your account could not be found. Please sign in again in AMC Receivables.');
      else gate('Sign in to continue', 'Ascensor Collections uses your AMC Receivables account. Sign in there, then switch back here.');
      return;
    }
    var row = s.profile, name = row.full_name || row.email || 'Signed in';
    $('acctName').textContent = name;
    $('acctRole').textContent = s.isAdmin ? 'Admin' : s.role === 'editor' ? 'Can edit' : 'Review only';
    var av = $('acctAvatar'), parts = name.trim().split(/\s+/);
    av.textContent = ((parts[0] || '')[0] || '').toUpperCase() + (parts.length > 1 ? (parts[parts.length - 1][0] || '').toUpperCase() : '');
    if (row.avatar_url && /^https:\/\//.test(row.avatar_url)) { av.style.backgroundImage = 'url("' + encodeURI(row.avatar_url) + '")'; av.textContent = ''; }
    var out = $('acctOut'); out.hidden = false;
    out.addEventListener('click', async function () { try { await s.sb.auth.signOut(); } catch (e) {} location.href = 'index.html'; });
    s.sb.auth.onAuthStateChange(function (event) { if (event === 'SIGNED_OUT') gate('Signed out', 'Sign in again in AMC Receivables to keep working here.'); });

    if (!s.canEdit) {
      var plainToast = toast, toldAt = 0;
      toast = function (msg) {
        if (Date.now() - (s.deniedAt || 0) < 4000) { if (Date.now() - toldAt > 3000) { toldAt = Date.now(); plainToast('Review-only access: that change was not saved.'); } return; }
        plainToast(msg);
      };
    }
    var dataRender = ROUTES.data.render, dashRender = ROUTES.dashboard.render;
    ROUTES.data.render = function (root, params) { dataRender(root, params); root.insertAdjacentHTML('afterbegin', seedCardHtml()); wireSeedCard(); };
    ROUTES.dashboard.render = function (root, params) {
      dashRender(root, params);
      var notes = '';
      if (!SEED.sites.length) notes += '<div class="banner">The shared client list has not been imported yet. ' + (s.isAdmin ? '<button class="link-btn" onclick="navigate(\'data\')">Open Data &amp; Backup to import it</button>' : 'Ask an admin to import it in Data &amp; Backup.') + '</div>';
      if (!s.canEdit) notes += '<div class="banner">You have review-only access. Changes you make here are not saved.</div>';
      if (notes) root.insertAdjacentHTML('afterbegin', notes);
    };
    document.body.classList.remove('lumen-locked'); $('lumenGate').hidden = true;
    rerender(); place(true);
  });
})();
</script>
</body>
</html>
